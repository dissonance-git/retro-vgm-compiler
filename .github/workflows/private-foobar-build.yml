name: Fingerprint foo_input_vgm 0.31 transfer chunks

on:
  push:
    branches: [ "temp-public-foobar-build-20260818" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: temp-public-foobar-build-20260818
          fetch-depth: 1
      - name: Publish locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" -d "{\"state\":\"pending\",\"context\":\"vgm031-chunks\",\"description\":\"run_id=$RUN_ID; fingerprinting\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null
      - name: Fingerprint chunks
        shell: bash
        run: |
          set -euo pipefail
          for f in .bootstrap-transfer/foo_input_vgm-0.31.b64.part00 .bootstrap-transfer/foo_input_vgm-0.31.b64.part01 .bootstrap-transfer/foo_input_vgm-0.31.b64.part02; do
            echo "== $f =="
            wc -c "$f"
            sha256sum "$f"
            python - "$f" <<'PY'
          import pathlib,re,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text(encoding='utf-8')
          clean=s.replace('\r','').replace('\n','')
          bad=sorted(set(re.sub(r'[A-Za-z0-9+/=]','',clean)))
          print('chars',len(s),'clean',len(clean),'mod4',len(clean)%4,'bad',repr(bad),'head',repr(clean[:24]),'tail',repr(clean[-24:]))
          PY
          done
      - name: Publish final locator
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; else state=failure; fi
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" -d "{\"state\":\"$state\",\"context\":\"vgm031-chunks\",\"description\":\"run_id=$RUN_ID; $JOB_STATUS\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null
