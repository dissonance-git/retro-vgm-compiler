name: Repair package verifier helper block

on:
  push:
    branches: [ "temp-public-foobar-build-20260818" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"

permissions:
  contents: write
  statuses: write

jobs:
  repair-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2

      - name: Publish repair run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"private-foobar-repair\",\"description\":\"run_id=$RUN_ID; verifier repair\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null

      - name: Repair verifier helper block
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/verify_private_component_packages.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('def verify_archive(')
          end = text.index('def validate_package(', start)
          block = '''def verify_archive(path: Path, expected_names: set[str], label: str) -> dict[str, bytes]:
              """Verify only the flat sibling payload envelope and return its bytes."""
              if not path.is_file():
                  raise AssertionError(f"{label} component package missing: {path}")
              if path.stat().st_size <= 0:
                  raise AssertionError(f"{label} component package is empty: {path}")

              try:
                  archive = zipfile.ZipFile(path, "r")
              except zipfile.BadZipFile as exc:
                  raise AssertionError(f"{label} component package is not a valid ZIP: {path}") from exc

              with archive:
                  infos = [info for info in archive.infolist() if not info.is_dir()]
                  names: list[str] = []
                  folded: set[str] = set()
                  payloads: dict[str, bytes] = {}
                  for info in infos:
                      try:
                          name = _validate_archive_name(info.filename)
                      except AssertionError as exc:
                          raise AssertionError(
                              f"{label} package has unsafe/nested member: {info.filename}"
                          ) from exc
                      key = name.casefold()
                      if key in folded:
                          raise AssertionError(
                              f"{label} package has duplicate case-insensitive member: {name}"
                          )
                      folded.add(key)
                      names.append(name)
                      data = archive.read(info)
                      if not data:
                          raise AssertionError(f"{label} package has zero-byte runtime member: {name}")
                      payloads[name] = data

                  if set(names) != expected_names:
                      raise AssertionError(
                          f"{label} payload mismatch: expected {sorted(expected_names)}, got {sorted(names)}"
                      )
                  return payloads


          def verify_runtime_contracts(
              path: Path,
              contracts: dict[str, tuple[int, frozenset[str]]],
              label: str,
          ) -> None:
              """Verify PE machine/export contracts independently of runtime loading."""
              payloads = verify_archive(path, set(contracts), label)
              for name, (machine, required_exports) in contracts.items():
                  try:
                      actual_machine, exports = inspect_pe(payloads[name])
                  except (ValueError, struct.error) as exc:
                      raise AssertionError(
                          f"{label} package member {name} is not a valid packaged PE: {exc}"
                      ) from exc
                  if actual_machine != machine:
                      raise AssertionError(
                          f"{label} package member {name} machine mismatch: "
                          f"expected 0x{machine:04X}, got 0x{actual_machine:04X}"
                      )
                  missing = required_exports - exports
                  if missing:
                      raise AssertionError(
                          f"{label} package member {name} missing required exports: {sorted(missing)}"
                      )


          def validate_spcplayer_startup_result(returncode: int, output: str) -> None:
              """Require the no-input child to reach its own usage path, not just load."""
              if returncode != 1:
                  raise AssertionError(
                      f"spcplayer expected usage exit 1 after successful startup, got {returncode}"
                  )
              if "usage" not in output.casefold():
                  raise AssertionError("spcplayer did not reach its own usage path")


          '''
          import textwrap
          block = textwrap.dedent(block)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8', newline='\n')
          compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          PY

          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          python -B -m unittest tests.test_private_component_package_contract

      - name: Publish verifier repair to main
        shell: bash
        run: |
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git add tools/verify_private_component_packages.py
          git diff --cached --check
          git commit -m "build: repair private package verifier helpers"
          git push origin HEAD:main

      - name: Publish final repair status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"private-foobar-repair\",\"description\":\"run_id=$RUN_ID; $JOB_STATUS\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null
