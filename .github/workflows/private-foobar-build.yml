name: Probe public foo_input_vgm 0.31 source

on:
  push:
    branches: [ "temp-public-foobar-build-20260818" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  probe-vgm031:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Publish locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"vgm031-probe\",\"description\":\"run_id=$RUN_ID; probing\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null

      - name: Download and fingerprint public 0.31 attachment
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          url='https://vgmrips.net/forum/download/file.php?id=5292'
          curl -L --fail --retry 3 --retry-delay 2 -A 'Mozilla/5.0 Retro-VGM-Compiler/0.31-probe' "$url" -o upstream.zip
          echo "archive_size=$(wc -c < upstream.zip | tr -d ' ')"
          sha256sum upstream.zip
          file upstream.zip
          rm -rf upstream
          mkdir upstream
          unzip -q upstream.zip -d upstream
          python - <<'PY'
          from pathlib import Path
          import hashlib

          expected = '36a25ee0cc5d9e8df6c7f7f3f0f06ce305dbbe27dbf8abbc28caa97a8ddb64fc'
          roots = sorted({p.parent.parent for p in Path('upstream').rglob('src/my_component_client.cpp') if p.parent.parent.name == 'foo_input_vgm'})
          if not roots:
              raise SystemExit('foo_input_vgm source root not found in public 0.31 attachment')
          print('candidate roots:')
          for root in roots:
              entries = []
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  rel = path.relative_to(root).as_posix()
                  entries.append((rel, hashlib.sha256(path.read_bytes()).hexdigest()))
              manifest = ''.join(f'{sha}  {rel}\n' for rel, sha in entries).encode()
              digest = hashlib.sha256(manifest).hexdigest()
              print(f'{root}: files={len(entries)} tree_sha256={digest}')
              if digest == expected:
                  print(f'MATCHED_USER_UPLOAD_SOURCE={root}')
                  Path('matched_root.txt').write_text(str(root), encoding='utf-8')
                  break
          else:
              raise SystemExit('public 0.31 attachment source tree does not match user-uploaded source tree')
          PY

      - name: Publish final locator
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"vgm031-probe\",\"description\":\"run_id=$RUN_ID; $JOB_STATUS\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null
