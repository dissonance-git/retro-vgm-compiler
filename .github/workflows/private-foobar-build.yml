# build-trigger: exact-031-runtime-delivery
name: Private foobar binary build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"
      - ".delivery-safe/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "components/vgm/**"
      - "components/spc/**"
      - "imports/MANIFEST.md"
      - "imports/foo_input_vgm-0.31.zip"
      - "model/**"
      - "patches/foo_input_vgm/**"
      - "patches/libvgm/**"
      - "patches/snesapu/**"
      - "tests/**"
      - "tools/build_private_foobar_components.ps1"
      - "tools/fetch_foo_input_vgm_bootstrap.ps1"
      - "tools/materialize_foo_input_vgm.py"
      - "tools/materialize_foo_snesapu.py"
      - "tools/verify_omniphony_runtime_abi.py"
      - "tools/verify_private_component_packages.py"
      - "tools/verify_private_component_bundle.py"

permissions:
  contents: read
  statuses: write

jobs:
  build-private-components:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Publish running locator for connected clients
        shell: pwsh
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $body = @{
            state = 'pending'
            context = 'private-foobar-binary'
            description = "run_id=$($env:RUN_ID); running"
            target_url = "https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "$($env:API_URL)/repos/$($env:REPOSITORY)/statuses/$($env:SOURCE_SHA)" `
            -Headers @{
              Authorization = "Bearer $($env:GH_TOKEN)"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -ContentType 'application/json' `
            -Body $body | Out-Null

      - name: Ensure native build tools
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
          }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          $nasmCandidates = @(
            'C:\Program Files\NASM\nasm.exe',
            'C:\Program Files (x86)\NASM\nasm.exe',
            'C:\ProgramData\chocolatey\bin\nasm.exe'
          )
          $nasmExePath = $nasmCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nasmExePath -and (Test-Path 'C:\ProgramData\chocolatey\lib\nasm')) {
            $nasmExePath = Get-ChildItem 'C:\ProgramData\chocolatey\lib\nasm' -Filter nasm.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $nasmExePath) { throw 'NASM was installed but nasm.exe could not be located' }
          $nasmDir = Split-Path $nasmExePath -Parent
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$nasmDir;$env:Path"
          git --version
          python --version
          cmake --version
          cargo --version
          & $nasmExePath -v
          7z | Select-Object -First 2

      - name: Reconstruct exact VGM 0.31 bootstrap
        shell: pwsh
        run: |
          $parts = @(
            '.delivery-safe/pre00',
            '.delivery-safe/pre01',
            '.delivery-safe/pre02',
            '.delivery-safe/chunk00',
            '.delivery-safe/chunk01',
            '.delivery-safe/chunk02',
            '.delivery-safe/chunk03',
            '.delivery-safe/chunk04',
            '.delivery-safe/chunk05a',
            '.delivery-safe/chunk05b',
            '.delivery-safe/chunk06',
            '.delivery-safe/chunk07',
            '.delivery-safe/chunk08',
            '.delivery-safe/chunk09',
            '.delivery-safe/chunk10'
          )
          foreach ($part in $parts) {
            if (-not (Test-Path -LiteralPath $part)) { throw "missing VGM bootstrap transfer part: $part" }
          }
          $b64 = (($parts | ForEach-Object { Get-Content -Raw -LiteralPath $_ }) -join '') -replace '\s', ''
          if ($b64.Length -ne 88336) { throw "unexpected VGM bootstrap base64 length: $($b64.Length)" }
          $b64Sha = [Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::ASCII.GetBytes($b64))).ToLowerInvariant()
          $expectedB64Sha = 'e0774db2137a56d3c592b9238be3727ed7521b1da4673f1f2f109c9e2d78b5b1'
          if ($b64Sha -ne $expectedB64Sha) { throw "VGM bootstrap base64 SHA-256 mismatch: $b64Sha" }
          $bytes = [Convert]::FromBase64String($b64)
          if ($bytes.Length -ne 66250) { throw "unexpected VGM bootstrap byte length: $($bytes.Length)" }
          $target = 'imports/foo_input_vgm-0.31.zip'
          [IO.File]::WriteAllBytes((Join-Path $PWD $target), $bytes)
          $sha = (Get-FileHash -Algorithm SHA256 -LiteralPath $target).Hash.ToLowerInvariant()
          $expected = 'e2c08ee82b10efd3b31f2304d0c9a7c0f5eae0e07a241e91108c81c3bedd01e1'
          if ($sha -ne $expected) { throw "VGM bootstrap SHA-256 mismatch: $sha" }
          python -B -c "import zipfile; p=r'imports/foo_input_vgm-0.31.zip'; z=zipfile.ZipFile(p); assert z.testzip() is None; assert len(z.infolist()) == 43; assert sum(not i.is_dir() for i in z.infolist()) == 41; print('verified VGM 0.31 ZIP entries:', len(z.infolist()))"
          if ($LASTEXITCODE -ne 0) { throw 'reconstructed VGM bootstrap failed ZIP validation' }
          Write-Host "VGM 0.31 bootstrap verified: $sha"

      - name: Run source and bridge regression guards
        shell: pwsh
        run: |
          python -B -m unittest tests.vgm.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'VGM Surround/Omniphony contract failed' }
          python -B -m unittest tests.spc.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'SPC Surround/Omniphony contract failed' }
          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          if ($LASTEXITCODE -ne 0) { throw 'private Omniphony dependency contract failed' }

      - name: Restore tracked transport placeholder
        shell: pwsh
        run: |
          git restore --source=HEAD --worktree -- imports/foo_input_vgm-0.31.zip
          git diff --quiet -- imports/foo_input_vgm-0.31.zip
          if ($LASTEXITCODE -ne 0) { throw 'tracked VGM bootstrap transport did not restore cleanly' }

      - name: Build and audit installable components
        shell: pwsh
        run: |
          ./tools/build_private_foobar_components.ps1

      - name: Show build manifest
        shell: pwsh
        run: |
          Get-Content dist/private-components/build-manifest.json
          Get-Content dist/private-components/SHA256SUMS.txt

      - name: Upload installable foobar components
        uses: actions/upload-artifact@v4
        with:
          name: private-foobar-vgm-spc-${{ github.sha }}
          path: |
            dist/private-components/foo_input_vgm.private.fb2k-component
            dist/private-components/foo_snesapu.private.fb2k-component
            dist/private-components/private-foobar-vgm-spc.zip
            dist/private-components/build-manifest.json
            dist/private-components/SHA256SUMS.txt
            dist/private-components/README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish final run locator for connected clients
        if: always()
        shell: pwsh
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = switch ($env:JOB_STATUS) {
            'success' { 'success' }
            'cancelled' { 'error' }
            default { 'failure' }
          }
          $body = @{
            state = $state
            context = 'private-foobar-binary'
            description = "run_id=$($env:RUN_ID); $($env:JOB_STATUS)"
            target_url = "https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "$($env:API_URL)/repos/$($env:REPOSITORY)/statuses/$($env:SOURCE_SHA)" `
            -Headers @{
              Authorization = "Bearer $($env:GH_TOKEN)"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -ContentType 'application/json' `
            -Body $body | Out-Null
