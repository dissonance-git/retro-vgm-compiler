name: Execute canonical private foobar repair

on:
  push:
    branches: [ "temp-public-foobar-build-20260818" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"

permissions:
  contents: write

jobs:
  repair-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 4

      - name: Restore pre-launcher build workflow and apply staged repair
        shell: bash
        run: |
          git show fc4959dd7ea0b1222bd64cd2512d5c8eec9d3af8:.github/workflows/private-foobar-build.yml > .github/workflows/private-foobar-build.yml
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/repair-private-foobar.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'staged-private-foobar-repair', 'exec'), {'__name__': '__main__'})
          PY

      - name: Publish canonical repair to main
        shell: bash
        run: |
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git add -A
          git diff --cached --check
          git commit -m "build: repair private foobar production path"
          git push origin HEAD:main
