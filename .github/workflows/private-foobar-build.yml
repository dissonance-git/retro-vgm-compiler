name: Locate exact historical VGM bootstrap blob

on:
  push:
    branches: [ "temp-public-foobar-build-20260818" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"

permissions:
  contents: read
  statuses: write

jobs:
  locate-bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"private-foobar-history\",\"description\":\"run_id=$RUN_ID; scanning\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null

      - name: Scan every historical archive blob
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          expected='93d71695fdad062dee47aefa3f857683e4a057302d1a069958eecf5dd18c60ff'
          found=''
          mapfile -t commits < <(git log --all --format='%H' -- imports/foo_input_vgm.7z)
          echo "historical commits touching archive: ${#commits[@]}"
          for commit in "${commits[@]}"; do
            if ! git cat-file -e "$commit:imports/foo_input_vgm.7z" 2>/dev/null; then
              continue
            fi
            git show "$commit:imports/foo_input_vgm.7z" > candidate.7z
            size=$(wc -c < candidate.7z | tr -d ' ')
            sha=$(sha256sum candidate.7z | awk '{print $1}')
            subject=$(git show -s --format='%s' "$commit")
            echo "$commit size=$size sha256=$sha subject=$subject"
            if [ "$sha" = "$expected" ]; then
              found="$commit"
              break
            fi
          done
          if [ -n "$found" ]; then
            echo "FOUND_EXACT_BOOTSTRAP=$found"
            echo "found=$found" >> "$GITHUB_OUTPUT"
          else
            echo 'FOUND_EXACT_BOOTSTRAP='
            echo 'found=' >> "$GITHUB_OUTPUT"
          fi

      - name: Publish final locator
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
          FOUND: ${{ steps.scan.outputs.found }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then state=success; else state=failure; fi
          desc="run_id=$RUN_ID; found=${FOUND:-none}"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"private-foobar-history\",\"description\":\"$desc\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null
