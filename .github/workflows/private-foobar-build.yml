name: Private foobar binary build

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"
      - ".delivery-safe/**"
      - "CMakeLists.txt"
      - "cmake/**"
      - "components/vgm/**"
      - "components/spc/**"
      - "imports/MANIFEST.md"
      - "imports/foo_input_vgm-0.31.zip"
      - "model/**"
      - "patches/foo_input_vgm/**"
      - "patches/libvgm/**"
      - "patches/snesapu/**"
      - "tests/**"
      - "tools/build_private_foobar_components.ps1"
      - "tools/fetch_foo_input_vgm_bootstrap.ps1"
      - "tools/materialize_foo_input_vgm.py"
      - "tools/materialize_foo_snesapu.py"
      - "tools/reconstruct_vgm031_bootstrap.py"
      - "tools/verify_omniphony_runtime_abi.py"
      - "tools/verify_private_component_packages.py"
      - "tools/verify_private_component_bundle.py"
      - "tools/verify_snesapu_package_runtime.ps1"

permissions:
  contents: write
  statuses: write

concurrency:
  group: private-foobar-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-private-components:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Publish running locator for connected clients
        shell: pwsh
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $body = @{
            state = 'pending'
            context = 'private-foobar-binary'
            description = "run_id=$($env:RUN_ID); running"
            target_url = "https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "$($env:API_URL)/repos/$($env:REPOSITORY)/statuses/$($env:SOURCE_SHA)" `
            -Headers @{
              Authorization = "Bearer $($env:GH_TOKEN)"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -ContentType 'application/json' `
            -Body $body | Out-Null

      - name: Ensure native build tools
        shell: pwsh
        run: |
          # The pinned SNESAPU assembly was authored for NASM 0.98.34. Keep CI
          # on the final NASM 2.x generation rather than accepting NASM 3 parser
          # drift from the ambient Chocolatey latest package.
          $nasmPackageVersion = '2.16.3'
          $nasmBinaryVersion = '2.16.03'
          choco install nasm --version=$nasmPackageVersion --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM $nasmPackageVersion installation failed: $LASTEXITCODE" }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          $nasmCandidates = @(
            'C:\Program Files\NASM\nasm.exe',
            'C:\Program Files (x86)\NASM\nasm.exe',
            'C:\ProgramData\chocolatey\bin\nasm.exe'
          )
          $nasmExePath = $nasmCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nasmExePath -and (Test-Path 'C:\ProgramData\chocolatey\lib\nasm')) {
            $nasmExePath = Get-ChildItem 'C:\ProgramData\chocolatey\lib\nasm' -Filter nasm.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $nasmExePath) { throw 'NASM was installed but nasm.exe could not be located' }
          $nasmDir = Split-Path $nasmExePath -Parent
          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$nasmDir;$env:Path"
          git --version
          python --version
          cmake --version
          cargo --version
          $nasmVersion = (& $nasmExePath -v | Out-String).Trim()
          Write-Host $nasmVersion
          if ($nasmVersion -notmatch "NASM version $([regex]::Escape($nasmBinaryVersion))\b") {
            throw "Unexpected NASM version after compatibility pin: $nasmVersion"
          }
          7z | Select-Object -First 2

      - name: Reconstruct exact VGM 0.31 bootstrap
        shell: pwsh
        run: |
          python -B tools/reconstruct_vgm031_bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'canonical VGM 0.31 bootstrap reconstruction failed' }

      - name: Run source and bridge regression guards
        shell: pwsh
        run: |
          python -B -m unittest tests.vgm.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'VGM Surround/Omniphony contract failed' }
          python -B -m unittest tests.spc.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'SPC Surround/Omniphony contract failed' }
          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          if ($LASTEXITCODE -ne 0) { throw 'private Omniphony dependency contract failed' }

      - name: Restore tracked transport placeholder
        shell: pwsh
        run: |
          git restore --source=HEAD --worktree -- imports/foo_input_vgm-0.31.zip
          git diff --quiet -- imports/foo_input_vgm-0.31.zip
          if ($LASTEXITCODE -ne 0) { throw 'tracked VGM bootstrap transport did not restore cleanly' }

      - name: Build and audit installable components
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          $wtlInclude = Join-Path $PWD '.private-component-build\WTL\Include'
          $env:INCLUDE = "$wtlInclude;$env:INCLUDE"
          $rsp = Join-Path $PWD 'Directory.Build.rsp'
          '/p:ConformanceMode=false' | Set-Content -LiteralPath $rsp -Encoding ASCII
          $env:_CL_ = "$env:_CL_ /permissive /Zc:twoPhase-"
          try {
            ./tools/build_private_foobar_components.ps1
          } finally {
            Remove-Item -LiteralPath $rsp -Force -ErrorAction SilentlyContinue
          }

      - name: Execute packaged SNESAPU runtime contract
        shell: pwsh
        run: |
          ./tools/verify_snesapu_package_runtime.ps1

      - name: Show build manifest
        shell: pwsh
        run: |
          Get-Content dist/private-components/build-manifest.json
          Get-Content dist/private-components/SHA256SUMS.txt

      - name: Upload installable foobar components
        uses: actions/upload-artifact@v4
        with:
          name: private-foobar-vgm-spc-${{ github.sha }}
          path: |
            dist/private-components/foo_input_vgm.private.fb2k-component
            dist/private-components/foo_snesapu.private.fb2k-component
            dist/private-components/private-foobar-vgm-spc.zip
            dist/private-components/build-manifest.json
            dist/private-components/SHA256SUMS.txt
            dist/private-components/README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish rolling verified delivery
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'private-foobar-delivery'
          $dist = 'dist/private-components'
          $assets = @(
            "$dist/private-foobar-vgm-spc.zip",
            "$dist/foo_input_vgm.private.fb2k-component",
            "$dist/foo_snesapu.private.fb2k-component",
            "$dist/build-manifest.json",
            "$dist/SHA256SUMS.txt",
            "$dist/README.txt"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) { throw "Missing verified delivery asset: $asset" }
          }

          $bundleSha = (Get-FileHash "$dist/private-foobar-vgm-spc.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $notes = @"
          Rolling verified foobar2000 VGM + SPC delivery owned by Retro VGM Compiler.

          Retro VGM Compiler source commit: $env:GITHUB_SHA
          Workflow run: $env:GITHUB_RUN_ID
          Bundle SHA-256: $bundleSha

          Assets are published only after the canonical private build, package verification, bundle verification, and packaged SNESAPU runtime smoke succeed.
          "@

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha="$env:GITHUB_SHA" -F force=true *> $null
            if ($LASTEXITCODE -ne 0) { throw 'Could not retarget rolling delivery tag' }
            gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace rolling delivery assets' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --title 'Private foobar VGM + SPC delivery' --notes $notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not update rolling delivery metadata' }
          } else {
            gh release create $tag @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Private foobar VGM + SPC delivery' --notes $notes --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'Could not create rolling delivery prerelease' }
          }

      - name: Publish final run locator for connected clients
        if: always()
        shell: pwsh
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = switch ($env:JOB_STATUS) {
            'success' { 'success' }
            'cancelled' { 'error' }
            default { 'failure' }
          }
          $body = @{
            state = $state
            context = 'private-foobar-binary'
            description = "run_id=$($env:RUN_ID); $($env:JOB_STATUS)"
            target_url = "https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "$($env:API_URL)/repos/$($env:REPOSITORY)/statuses/$($env:SOURCE_SHA)" `
            -Headers @{
              Authorization = "Bearer $($env:GH_TOKEN)"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -ContentType 'application/json' `
            -Body $body | Out-Null
