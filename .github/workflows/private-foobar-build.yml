name: Private foobar binary build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "temp-public-foobar-build-20260818" ]
    paths:
      - ".github/workflows/private-foobar-build.yml"
      - "components/vgm/**"
      - "components/spc/**"
      - "model/**"
      - "patches/foo_input_vgm/**"
      - "patches/libvgm/**"
      - "patches/snesapu/**"
      - "tests/private_components/**"
      - "tests/integration/libvgm-source/**"
      - "tests/vgm/test_surround_omniphony_patch_contract.py"
      - "tests/spc/test_surround_omniphony_patch_contract.py"
      - "tests/vgm/test_omniphony_private_build_contract.py"
      - "tools/build_private_foobar_components.ps1"
      - "tools/materialize_foo_input_vgm.py"
      - "tools/materialize_foo_snesapu.py"
      - "tools/verify_omniphony_runtime_abi.py"
      - "tools/verify_private_component_packages.py"
      - "tools/verify_private_component_bundle.py"

permissions:
  contents: read
  statuses: write

jobs:
  build-private-components:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Publish running locator for connected clients
        shell: pwsh
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          $body = @{
            state = 'pending'
            context = 'private-foobar-binary'
            description = "run_id=$($env:RUN_ID); running"
            target_url = "https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "$($env:API_URL)/repos/$($env:REPOSITORY)/statuses/$($env:SOURCE_SHA)" `
            -Headers @{
              Authorization = "Bearer $($env:GH_TOKEN)"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -ContentType 'application/json' `
            -Body $body | Out-Null

      - name: Ensure native build tools
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {
            choco install nasm -y --no-progress
          }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
          }
          git --version
          python --version
          cmake --version
          cargo --version
          nasm -v
          7z | Select-Object -First 2

      - name: Run source and bridge regression guards
        shell: pwsh
        run: |
          python -B -m unittest tests.vgm.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'VGM Surround/Omniphony contract failed' }
          python -B -m unittest tests.spc.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'SPC Surround/Omniphony contract failed' }
          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          if ($LASTEXITCODE -ne 0) { throw 'private Omniphony dependency contract failed' }

      - name: Build and audit installable components
        shell: pwsh
        run: |
          $builder = Get-Content ./tools/build_private_foobar_components.ps1 -Raw
          $builder = $builder.Replace('$LASTEXITCODE:', '${LASTEXITCODE}:')
          $ciBuilder = './tools/.ci-build_private_foobar_components.ps1'
          Set-Content -LiteralPath $ciBuilder -Value $builder -NoNewline -Encoding utf8
          & $ciBuilder
          if ($LASTEXITCODE -ne 0) { throw "temporary builder failed with exit code $LASTEXITCODE" }

      - name: Show build manifest
        shell: pwsh
        run: |
          Get-Content dist/private-components/build-manifest.json
          Get-Content dist/private-components/SHA256SUMS.txt

      - name: Upload installable foobar components
        uses: actions/upload-artifact@v4
        with:
          name: private-foobar-vgm-spc-${{ github.sha }}
          path: |
            dist/private-components/foo_input_vgm.private.fb2k-component
            dist/private-components/foo_snesapu.private.fb2k-component
            dist/private-components/private-foobar-vgm-spc.zip
            dist/private-components/build-manifest.json
            dist/private-components/SHA256SUMS.txt
            dist/private-components/README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish final run locator for connected clients
        if: always()
        shell: pwsh
        env:
          API_URL: ${{ github.api_url }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $state = switch ($env:JOB_STATUS) {
            'success' { 'success' }
            'cancelled' { 'error' }
            default { 'failure' }
          }
          $body = @{
            state = $state
            context = 'private-foobar-binary'
            description = "run_id=$($env:RUN_ID); $($env:JOB_STATUS)"
            target_url = "https://github.com/$($env:REPOSITORY)/actions/runs/$($env:RUN_ID)"
          } | ConvertTo-Json -Compress
          Invoke-RestMethod `
            -Method Post `
            -Uri "$($env:API_URL)/repos/$($env:REPOSITORY)/statuses/$($env:SOURCE_SHA)" `
            -Headers @{
              Authorization = "Bearer $($env:GH_TOKEN)"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
            } `
            -ContentType 'application/json' `
            -Body $body | Out-Null
