name: Repair private foobar build path

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/repair-private-foobar.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply bounded canonical repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(path: str, old: str, new: str) -> None:
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one repair anchor, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          # 1. Remove the one duplicate core-test owner. The root CMake registry
          # already owns genesis_enhanced_recomposition; the host seam must not
          # register the same executable/test a second time.
          path = "cmake/host_transport_tests.cmake"
          replace_once(path,
              "    spc_original_sample_bank_test\n    genesis_enhanced_recomposition_test\n    sn76489_enhanced_source_block_test\n",
              "    spc_original_sample_bank_test\n    sn76489_enhanced_source_block_test\n")
          replace_once(path,
              "add_executable(\n    genesis_enhanced_recomposition_test\n    tests/vgm/genesis_enhanced_recomposition_test.cpp\n)\n",
              "")
          replace_once(path,
              "target_include_directories(\n    genesis_enhanced_recomposition_test\n    PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}\n)\n",
              "")
          replace_once(path,
              "add_test(\n    NAME genesis_enhanced_recomposition\n    COMMAND genesis_enhanced_recomposition_test\n)\n",
              "")

          # 2. Guard the SPC 48 kHz patch against a second application. Its
          # predecessor prefix intentionally survives inside the replacement,
          # so an explicit post-patch marker is required for fail-closed use.
          path = "patches/snesapu/apply_enhanced_runtime.py"
          replace_once(path,
              '    input_cpp = root / "input_snesapu.cpp"\n\n    replace_once(\n',
              '    input_cpp = root / "input_snesapu.cpp"\n\n'
              '    existing_text, _, _ = decode_source(input_cpp.read_bytes())\n'
              '    if "Private playback has one final host clock in every combination." in existing_text:\n'
              '        raise RuntimeError("SNES private 48 kHz host and enhanced source policy is already applied")\n\n'
              '    replace_once(\n')

          # 3. Historical vgmspc provenance may remain, but maintained surfaces
          # must not name its retired imports path as a live route.
          replace_once(
              "components/spc/spcplayer/README.md",
              "The migrated `spcplayer` source retains its Mozilla Public License 2.0 notices. The migration ledger in `imports/vgmspc/MIGRATION.md` records why this code moved and which portions of the old project were intentionally not carried forward.\n",
              "The migrated `spcplayer` source retains its Mozilla Public License 2.0 notices. The preserved historical migration ledger records why this code moved and which portions of the old project were intentionally not carried forward.\n",
          )

          # 4. enhanced is a descriptive adjective, not a product/proper name.
          for path in (
              "patches/foo_input_vgm/apply_private_48khz_output.py",
              "patches/foo_input_vgm/apply_source_aware_shadow_include.py",
              "patches/foo_input_vgm/apply_spatial_selected_source_transport.py",
          ):
              text = read(path)
              text, count = re.subn(r"\bEnhanced\b", "enhanced", text)
              if count == 0:
                  raise RuntimeError(f"{path}: expected at least one stale Enhanced wording")
              write(path, text)

          # 5. Restore the package verifier's small testable seams around the
          # newer all-in-one production validator, and make the real Windows
          # child startup check require the child's own usage path.
          path = "tools/verify_private_component_packages.py"
          helpers = r'''

def verify_archive(path: Path, expected_names: set[str], label: str) -> dict[str, bytes]:
    """Verify only the flat sibling payload envelope and return its bytes."""
    if not path.is_file():
        raise AssertionError(f"{label} component package missing: {path}")
    if path.stat().st_size <= 0:
        raise AssertionError(f"{label} component package is empty: {path}")

    try:
        archive = zipfile.ZipFile(path, "r")
    except zipfile.BadZipFile as exc:
        raise AssertionError(f"{label} component package is not a valid ZIP: {path}") from exc

    with archive:
        infos = [info for info in archive.infolist() if not info.is_dir()]
        names: list[str] = []
        folded: set[str] = set()
        payloads: dict[str, bytes] = {}
        for info in infos:
            try:
                name = _validate_archive_name(info.filename)
            except AssertionError as exc:
                raise AssertionError(
                    f"{label} package has unsafe/nested member: {info.filename}"
                ) from exc
            key = name.casefold()
            if key in folded:
                raise AssertionError(
                    f"{label} package has duplicate case-insensitive member: {name}"
                )
            folded.add(key)
            names.append(name)
            data = archive.read(info)
            if not data:
                raise AssertionError(f"{label} package has zero-byte runtime member: {name}")
            payloads[name] = data

        if set(names) != expected_names:
            raise AssertionError(
                f"{label} payload mismatch: expected {sorted(expected_names)}, got {sorted(names)}"
            )
        return payloads


def verify_runtime_contracts(
    path: Path,
    contracts: dict[str, tuple[int, frozenset[str]]],
    label: str,
) -> None:
    """Verify PE machine/export contracts independently of runtime loading."""
    payloads = verify_archive(path, set(contracts), label)
    for name, (machine, required_exports) in contracts.items():
        try:
            actual_machine, exports = inspect_pe(payloads[name])
        except (ValueError, struct.error) as exc:
            raise AssertionError(
                f"{label} package member {name} is not a valid packaged PE: {exc}"
            ) from exc
        if actual_machine != machine:
            raise AssertionError(
                f"{label} package member {name} machine mismatch: "
                f"expected 0x{machine:04X}, got 0x{actual_machine:04X}"
            )
        missing = required_exports - exports
        if missing:
            raise AssertionError(
                f"{label} package member {name} missing required exports: {sorted(missing)}"
            )


def validate_spcplayer_startup_result(returncode: int, output: str) -> None:
    """Require the no-input child to reach its own usage path, not just load."""
    if returncode != 1:
        raise AssertionError(
            f"spcplayer expected usage exit 1 after successful startup, got {returncode}"
        )
    if "usage" not in output.casefold():
        raise AssertionError("spcplayer did not reach its own usage path")

'''
          replace_once(path, "\ndef validate_package(\n", helpers + "\ndef validate_package(\n")
          replace_once(path,
              '''        output = (child.stdout + "\\n" + child.stderr).casefold()\n        if child.returncode == -1073741515 or "0xc0000135" in output:\n            raise AssertionError(\n                "packaged spcplayer could not resolve its sibling SNESAPU/runtime dependencies"\n            )\n        if child.returncode == 0:\n            raise AssertionError("spcplayer unexpectedly succeeded without an input file")\n''',
              '''        output = child.stdout + "\\n" + child.stderr\n        validate_spcplayer_startup_result(child.returncode, output)\n''')

          # 6. Bring stale tests back to the current Surround and ABI contracts.
          path = "tests/test_private_component_bundle_contract.py"
          text = read(path).replace("Spatial", "Surround")
          write(path, text)

          path = "tests/test_private_component_builder_contract.py"
          text = read(path).replace("Spatial", "Surround")
          write(path, text)

          path = "tests/test_omniphony_runtime_abi_contract.py"
          text = read(path)
          text = text.replace("minor: int = 3", "minor: int = 4")
          replace_once(path,
              "        self.omniphony_source_reset = object()\n        self.omniphony_source_process_events_f32 = object()\n",
              "        self.omniphony_source_reset = object()\n        self.omniphony_source_set_mix_budget = object()\n        self.omniphony_source_process_events_f32 = object()\n")
          text = read(path)
          text = text.replace(r"(\d+)u", r"(\d+)(?:u)?")
          text = text.replace("FakeApi(0, 3)), (0, 3)", "FakeApi(0, 4)), (0, 4)")
          text = text.replace("FakeApi(1, 3)", "FakeApi(1, 4)")
          text = text.replace("FakeApi(0, 2)", "FakeApi(0, 3)")
          write(path, text)

          # 7. Recover the historical VGM bootstrap without weakening its
          # identity. The checked-in binary is truncated; builds fetch the exact
          # v0.30 public artifact and accept it only when the preserved SHA-256
          # matches the original manifest.
          fetcher = r'''param(
    [Parameter(Mandatory = $true)][string]$OutputPath,
    [Parameter(Mandatory = $true)][string]$DownloadPage,
    [Parameter(Mandatory = $true)][string]$ExpectedSha256
)

$ErrorActionPreference = 'Stop'
Set-StrictMode -Version Latest

$parent = Split-Path $OutputPath -Parent
if ($parent -and !(Test-Path $parent)) {
    New-Item -ItemType Directory -Path $parent -Force | Out-Null
}

$session = [Microsoft.PowerShell.Commands.WebRequestSession]::new()
$headers = @{ 'User-Agent' = 'Mozilla/5.0 Retro-VGM-Compiler/verified-bootstrap' }
$response = Invoke-WebRequest -Uri $DownloadPage -WebSession $session -Headers $headers
$tokenField = @($response.InputFields | Where-Object { $_.name -eq 'token' }) | Select-Object -First 1
if (!$tokenField -or [string]::IsNullOrWhiteSpace([string]$tokenField.value)) {
    throw "uploader.jp bootstrap page did not expose a download token: $DownloadPage"
}

Start-Sleep -Seconds 2
$response = Invoke-WebRequest `
    -Uri $DownloadPage `
    -Method Post `
    -Body @{ token = [string]$tokenField.value } `
    -WebSession $session `
    -Headers $headers
$downloadLink = @($response.Links | Where-Object { [string]$_.href -match 'downloadx' }) | Select-Object -First 1
if (!$downloadLink) {
    throw "uploader.jp did not return a downloadx link for the verified bootstrap"
}

$href = [System.Net.WebUtility]::HtmlDecode([string]$downloadLink.href)
$href = [System.Uri]::UnescapeDataString($href)
$base = [System.Uri]::new($DownloadPage)
$downloadUri = [System.Uri]::new($base, $href)

Start-Sleep -Seconds 2
Invoke-WebRequest -Uri $downloadUri.AbsoluteUri -OutFile $OutputPath -WebSession $session -Headers $headers
if (!(Test-Path -LiteralPath $OutputPath -PathType Leaf)) {
    throw "verified foo_input_vgm bootstrap download did not create $OutputPath"
}
$actual = (Get-FileHash -LiteralPath $OutputPath -Algorithm SHA256).Hash.ToLowerInvariant()
$expected = $ExpectedSha256.ToLowerInvariant()
if ($actual -ne $expected) {
    Remove-Item -LiteralPath $OutputPath -Force -ErrorAction SilentlyContinue
    throw "foo_input_vgm bootstrap SHA-256 mismatch: expected $expected, got $actual"
}
Write-Host "verified foo_input_vgm bootstrap: $actual"
'''
          write("tools/fetch_foo_input_vgm_bootstrap.ps1", fetcher)

          path = "tools/materialize_foo_input_vgm.py"
          text = read(path)
          text = text.replace(
              "The historical upstream plugin is preserved immutably in imports/foo_input_vgm.7z.\n",
              "The historical upstream plugin is identified by an immutable archive hash. The build\nmay supply a separately recovered copy through RETRO_VGM_BOOTSTRAP_ARCHIVE when the\nrepository transport copy is unavailable or damaged.\n",
          )
          text = text.replace("import argparse\n", "import argparse\nimport os\n", 1)
          replace_once(path,
              '        help="override imports/foo_input_vgm.7z",\n',
              '        help="override the historical foo_input_vgm bootstrap archive",\n')
          replace_once(path,
              '    repo = Path(__file__).resolve().parents[1]\n    archive = (args.archive or (repo / "imports" / "foo_input_vgm.7z")).resolve()\n',
              '    repo = Path(__file__).resolve().parents[1]\n'
              '    env_archive = os.environ.get("RETRO_VGM_BOOTSTRAP_ARCHIVE")\n'
              '    selected_archive = args.archive or (Path(env_archive) if env_archive else None)\n'
              '    archive = (selected_archive or (repo / "imports" / "foo_input_vgm.7z")).resolve()\n')

          path = "imports/MANIFEST.md"
          replace_once(path,
              "The archive is an immutable bootstrap copy. Normal development should occur from the expanded source under `components/vgm/`, not by editing/repacking the archive.\n",
              "The archive identity is immutable, but the current GitHub transport copy is known to be truncated and is not accepted as a build input. Canonical Windows builds recover `foo_input_vgm_v0.30.7z` from `https://uu.getuploader.com/foobar2000/download/248` into disposable build state and require the SHA-256 above before extraction. This is a recovery route for the same audited source object, not permission to substitute v0.31 or another release. Normal development occurs from the expanded source under `components/vgm/`; the historical archive is never edited or repacked.\n")

          # 8. Fix the PowerShell runner semantics in the canonical builder and
          # recover/verify the VGM bootstrap before any materialization tests.
          path = "tools/build_private_foobar_components.ps1"
          text = read(path)
          text = text.replace("[string[]]$Args", "[string[]]$CommandArgs")
          text = text.replace("& $Exe @Args", "& $Exe @CommandArgs")
          text = text.replace("$($Args -join ' ')", "$($CommandArgs -join ' ')")
          text = text.replace("$LASTEXITCODE:", "${LASTEXITCODE}:")
          text = text.replace("$Path:", "${Path}:")
          write(path, text)
          replace_once(path,
              "$FoobarSdkUrl = 'https://www.foobar2000.org/downloads/SDK-2025-03-07.7z'\n",
              "$FoobarSdkUrl = 'https://www.foobar2000.org/downloads/SDK-2025-03-07.7z'\n"
              "$VgmBootstrapUrl = 'https://uu.getuploader.com/foobar2000/download/248'\n"
              "$VgmBootstrapSha256 = '93d71695fdad062dee47aefa3f857683e4a057302d1a069958eecf5dd18c60ff'\n")
          replace_once(path,
              "$SpcComponentOutDir = Join-Path $WorkRoot 'out-spc-x64'\n",
              "$SpcComponentOutDir = Join-Path $WorkRoot 'out-spc-x64'\n"
              "$VgmBootstrap = Join-Path $WorkRoot 'foo_input_vgm_v0.30.7z'\n")
          replace_once(path,
              "New-Item -ItemType Directory $WorkRoot, $OutputRoot, $VgmOutDir, $SpcPlayerOutDir, $SpcComponentOutDir -Force | Out-Null\n\nWrite-Host '== 1. Compile the private source-transport frontier tests =='\n",
              "New-Item -ItemType Directory $WorkRoot, $OutputRoot, $VgmOutDir, $SpcPlayerOutDir, $SpcComponentOutDir -Force | Out-Null\n\n"
              "Write-Host '== 0. Recover and verify the historical foo_input_vgm bootstrap =='\n"
              "& (Join-Path $RetroRoot 'tools\\fetch_foo_input_vgm_bootstrap.ps1') -OutputPath $VgmBootstrap -DownloadPage $VgmBootstrapUrl -ExpectedSha256 $VgmBootstrapSha256\n"
              "$env:RETRO_VGM_BOOTSTRAP_ARCHIVE = $VgmBootstrap\n\n"
              "Write-Host '== 1. Compile the private source-transport frontier tests =='\n")
          replace_once(path,
              "    libvgm = $LibvgmCommit\n    spcplay = $SpcPlayCommit\n",
              "    libvgm = $LibvgmCommit\n"
              "    foo_input_vgm_bootstrap = [ordered]@{ source = $VgmBootstrapUrl; sha256 = $VgmBootstrapSha256 }\n"
              "    spcplay = $SpcPlayCommit\n")

          # 9. Use the actual VS2022 image, make freshly installed NASM visible,
          # and run the corrected canonical builder directly.
          path = ".github/workflows/private-foobar-build.yml"
          text = read(path)
          text = text.replace("runs-on: windows-latest", "runs-on: windows-2022")
          old_tools = '''          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {\n            choco install nasm -y --no-progress\n          }\n          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {\n            choco install 7zip -y --no-progress\n          }\n          git --version\n          python --version\n          cmake --version\n          cargo --version\n          nasm -v\n          7z | Select-Object -First 2\n'''
          new_tools = '''          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) {\n            choco install nasm -y --no-progress\n          }\n          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {\n            choco install 7zip -y --no-progress\n          }\n          $nasmCandidates = @(\n            'C:\\Program Files\\NASM\\nasm.exe',\n            'C:\\Program Files (x86)\\NASM\\nasm.exe',\n            'C:\\ProgramData\\chocolatey\\bin\\nasm.exe'\n          )\n          $nasmExePath = $nasmCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1\n          if (-not $nasmExePath -and (Test-Path 'C:\\ProgramData\\chocolatey\\lib\\nasm')) {\n            $nasmExePath = Get-ChildItem 'C:\\ProgramData\\chocolatey\\lib\\nasm' -Filter nasm.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName\n          }\n          if (-not $nasmExePath) { throw 'NASM was installed but nasm.exe could not be located' }\n          $nasmDir = Split-Path $nasmExePath -Parent\n          $nasmDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append\n          $env:Path = "$nasmDir;$env:Path"\n          git --version\n          python --version\n          cmake --version\n          cargo --version\n          & $nasmExePath -v\n          7z | Select-Object -First 2\n'''
          if old_tools not in text:
              raise RuntimeError("private workflow native-tool anchor drifted")
          text = text.replace(old_tools, new_tools, 1)
          text = text.replace(
              '      - "tools/materialize_foo_input_vgm.py"\n',
              '      - "tools/materialize_foo_input_vgm.py"\n      - "tools/fetch_foo_input_vgm_bootstrap.ps1"\n',
              1,
          )
          write(path, text)

          # Sanity-check the exact stale forms that caused the live runner to fail.
          assert "[string[]]$Args" not in read("tools/build_private_foobar_components.ps1")
          assert "$LASTEXITCODE:" not in read("tools/build_private_foobar_components.ps1")
          assert "runs-on: windows-latest" not in read(".github/workflows/private-foobar-build.yml")
          assert "genesis_enhanced_recomposition_test\n    sn76489_enhanced_source_block_test" not in read("cmake/host_transport_tests.cmake")
          PY

      - name: Commit repair atomically
        shell: bash
        run: |
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git add \
            cmake/host_transport_tests.cmake \
            patches/snesapu/apply_enhanced_runtime.py \
            components/spc/spcplayer/README.md \
            patches/foo_input_vgm/apply_private_48khz_output.py \
            patches/foo_input_vgm/apply_source_aware_shadow_include.py \
            patches/foo_input_vgm/apply_spatial_selected_source_transport.py \
            tools/verify_private_component_packages.py \
            tests/test_private_component_bundle_contract.py \
            tests/test_private_component_builder_contract.py \
            tests/test_omniphony_runtime_abi_contract.py \
            tools/fetch_foo_input_vgm_bootstrap.ps1 \
            tools/materialize_foo_input_vgm.py \
            imports/MANIFEST.md \
            tools/build_private_foobar_components.ps1 \
            .github/workflows/private-foobar-build.yml
          git diff --cached --check
          git commit -m "build: repair private foobar production path"
          git push origin HEAD:main
