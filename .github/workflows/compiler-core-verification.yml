name: Compiler core verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compiler-core-verification.yml'

permissions:
  contents: write

jobs:
  dependency-free-compiler-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply provisional core repairs
        run: python -B tools/ci/compiler_core_verification_repair.py

      - name: Instrument PSG alias regression
        run: python -B tools/ci/instrument_sn76489_alias.py

      - name: Configure compiler core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAMEAUDIO_BUILD_CORE_TESTS=ON

      - name: Build PSG alias target
        run: cmake --build build --target sn76489_alias_test --parallel 2

      - name: Run PSG alias target
        run: ./build/sn76489_alias_test
