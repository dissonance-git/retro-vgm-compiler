name: Compiler core verification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compiler-core-verification.yml'

permissions:
  contents: write

jobs:
  dependency-free-compiler-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep test assertions active in Release
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CMakeLists.txt')
          text = path.read_text(encoding='utf-8')
          replacements = (
              (
                  'target_compile_options(${test_target} PRIVATE /W4 /permissive-)',
                  'target_compile_options(${test_target} PRIVATE /W4 /permissive- /UNDEBUG)',
              ),
              (
                  'target_compile_options(${test_target} PRIVATE -Wall -Wextra -Wpedantic -Werror)',
                  'target_compile_options(${test_target} PRIVATE -Wall -Wextra -Wpedantic -Werror -UNDEBUG)',
              ),
          )
          changed = False
          for old, new in replacements:
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'core test compile-option anchor is not singular: {old}')
                  text = text.replace(old, new, 1)
                  changed = True
              elif new not in text:
                  raise SystemExit(f'core test compile-option anchor not found: {old}')
          if changed:
              path.write_text(text, encoding='utf-8')
          PY

      - name: Repair stale Genesis spatial path assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/vgm/genesis_enhanced_recomposition_test.cpp')
          text = path.read_text(encoding='utf-8')
          old = 'spatial_playback_path::source_full_sphere'
          new = 'spatial_playback_path::source_spatial'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('stale Genesis spatial-path assertion is not singular')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Genesis spatial-path assertion anchor not found')
          PY

      - name: Repair stale spatial playback contract test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/model/spatial_source_test.cpp')
          text = path.read_text(encoding='utf-8')
          start_marker = '    // Both foobar components expose enhancement and spatialization as separate\n'
          end_marker = '    auto genesis = gameaudio::vgm::make_genesis_spatial_source('
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start < 0 or end < 0 or end <= start:
              if 'spatial_playback_path::source_spatial' in text and 'uses_externalization' not in text:
                  raise SystemExit(0)
              raise SystemExit('spatial playback regression markers not found')
          replacement = '\n'.join([
              '    // Both foobar components expose enhancement and spatialization as separate',
              '    // user choices. Renderer topology stays internal to Omniphony.',
              '    vgmtooling::model::spatial_playback_options playback{};',
              '    assert(!playback.surround);',
              '    assert(!playback.enhanced);',
              '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
              '        == vgmtooling::model::spatial_playback_path::reference_stereo);',
              '    assert(!vgmtooling::model::uses_source_renderer(playback));',
              '    assert(!vgmtooling::model::uses_enhanced_renderer(playback));',
              '',
              '    playback.enhanced = true;',
              '    assert(vgmtooling::model::uses_enhanced_renderer(playback));',
              '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
              '        == vgmtooling::model::spatial_playback_path::reference_stereo);',
              '    assert(!vgmtooling::model::uses_source_renderer(playback));',
              '',
              '    playback.surround = true;',
              '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
              '        == vgmtooling::model::spatial_playback_path::source_spatial);',
              '    assert(vgmtooling::model::uses_source_renderer(playback));',
              '    assert(vgmtooling::model::uses_enhanced_renderer(playback));',
              '',
              '    playback.enhanced = false;',
              '    assert(!vgmtooling::model::uses_enhanced_renderer(playback));',
              '    assert(vgmtooling::model::uses_source_renderer(playback));',
              '',
              '    playback.surround = false;',
              '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
              '        == vgmtooling::model::spatial_playback_path::reference_stereo);',
              '    assert(!vgmtooling::model::uses_source_renderer(playback));',
              '',
              '',
          ])
          text = text[:start] + replacement + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Repair YM2612 PCM stream default construction
        run: |
          python - <<'PY'
          from pathlib import Path

          header = Path('components/vgm/enhancement/ym2612_pcm_stream.h')
          text = header.read_text(encoding='utf-8')
          old = '    explicit ym2612_pcm_stream(double output_sample_rate = 48000.0) noexcept;'
          new = '    ym2612_pcm_stream() noexcept;\n    explicit ym2612_pcm_stream(double output_sample_rate) noexcept;'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('YM2612 PCM stream constructor anchor is not singular')
              text = text.replace(old, new, 1)
              header.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('YM2612 PCM stream constructor anchor not found')

          implementation = Path('components/vgm/enhancement/ym2612_pcm_stream.cpp')
          text = implementation.read_text(encoding='utf-8')
          old = 'ym2612_pcm_stream::ym2612_pcm_stream(double output_sample_rate) noexcept {'
          new = 'ym2612_pcm_stream::ym2612_pcm_stream() noexcept\n    : ym2612_pcm_stream(48000.0) {}\n\nym2612_pcm_stream::ym2612_pcm_stream(double output_sample_rate) noexcept {'
          if 'ym2612_pcm_stream::ym2612_pcm_stream() noexcept' not in text:
              if text.count(old) != 1:
                  raise SystemExit('YM2612 PCM stream implementation anchor is not singular')
              text = text.replace(old, new, 1)
              implementation.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('YM2612 PCM stream default constructor is inconsistent')
          PY

      - name: Qualify Genesis pitch transition id
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/vgm/enhancement/genesis_pitch_control_adapter.h')
          text = path.read_text(encoding='utf-8')
          old = '    const node_id device_transition_id = *result.performance.execution.device_transition_id;'
          new = '    const vgmtooling::model::node_id device_transition_id = *result.performance.execution.device_transition_id;'
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('Genesis pitch transition-id anchor is not singular')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Genesis pitch transition-id anchor not found')
          PY

      - name: Configure full compiler core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAMEAUDIO_BUILD_CORE_TESTS=ON
      - name: Build full compiler core
        run: cmake --build build --parallel 2
      - name: Run full compiler core
        run: ctest --test-dir build --output-on-failure
      - name: Validate core repairs
        run: |
          git diff --check
          grep -q -- '-UNDEBUG' CMakeLists.txt
          grep -q 'spatial_playback_path::source_spatial' tests/vgm/genesis_enhanced_recomposition_test.cpp
          grep -q 'spatial_playback_path::source_spatial' tests/model/spatial_source_test.cpp
          ! grep -q 'uses_externalization' tests/model/spatial_source_test.cpp
          ! grep -q 'spatial_depth_mode' tests/model/spatial_source_test.cpp
          grep -q 'ym2612_pcm_stream() noexcept' components/vgm/enhancement/ym2612_pcm_stream.h
          grep -q ': ym2612_pcm_stream(48000.0)' components/vgm/enhancement/ym2612_pcm_stream.cpp
          grep -q 'vgmtooling::model::node_id device_transition_id' components/vgm/enhancement/genesis_pitch_control_adapter.h
      - name: Commit verified core repairs
        run: |
          if git diff --quiet -- \
            CMakeLists.txt \
            tests/vgm/genesis_enhanced_recomposition_test.cpp \
            tests/model/spatial_source_test.cpp \
            components/vgm/enhancement/ym2612_pcm_stream.h \
            components/vgm/enhancement/ym2612_pcm_stream.cpp \
            components/vgm/enhancement/genesis_pitch_control_adapter.h; then
            exit 0
          fi
          git config user.name dissonance
          git config user.email ustreamusa@aim.com
          git add \
            CMakeLists.txt \
            tests/vgm/genesis_enhanced_recomposition_test.cpp \
            tests/model/spatial_source_test.cpp \
            components/vgm/enhancement/ym2612_pcm_stream.h \
            components/vgm/enhancement/ym2612_pcm_stream.cpp \
            components/vgm/enhancement/genesis_pitch_control_adapter.h
          git commit -m 'test(core): restore live Release verification'
          git push
