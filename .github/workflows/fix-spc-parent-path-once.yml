name: One-shot SPC parent path repair

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/fix-spc-parent-path-once.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair canonical materialized parent path
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path("tools/build_private_foobar_components.ps1")
          data = target.read_bytes()
          old = b"Join-Path $SpcRoot 'foo_snesapu\\foo_snesapu.vcxproj'"
          new = b"Join-Path $SpcRoot 'foobar2000\\foo_snesapu\\foo_snesapu.vcxproj'"
          count = data.count(old)
          if count != 1:
              raise SystemExit(f"expected one canonical parent-path repair, found {count}")
          target.write_bytes(data.replace(old, new, 1))
          print("repaired private builder parent project path")
          PY
          git diff --check

      - name: Commit builder repair
        shell: bash
        run: |
          git config user.name dissonance
          git config user.email ustreamusa@aim.com
          git add tools/build_private_foobar_components.ps1
          git commit -m "fix(spc): build canonical materialized parent"
          git push origin HEAD:main
