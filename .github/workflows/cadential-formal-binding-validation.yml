name: Cadential formal binding validation

on:
  push:
    branches:
      - cadential-formal-binding
  workflow_dispatch:

jobs:
  semantic-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure project
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Compile and run integrated cadence binding regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -I. \
            tests/model/ionian_cadence_formal_binding_test.cpp \
            -o /tmp/ionian_cadence_formal_binding_test
          /tmp/ionian_cadence_formal_binding_test

      - name: Compile and run formal closure regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -I. \
            tests/model/cadential_formal_closure_evidence_test.cpp \
            -o /tmp/cadential_formal_closure_evidence_test
          /tmp/cadential_formal_closure_evidence_test

      - name: Compile and run cadence class regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -I. \
            tests/model/ionian_cadence_class_hypothesis_test.cpp \
            -o /tmp/ionian_cadence_class_hypothesis_test
          /tmp/ionian_cadence_class_hypothesis_test

      - name: Compile and run functional tendency regression
        run: |
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -UNDEBUG -I. \
            tests/model/ionian_functional_tendency_hypothesis_test.cpp \
            -o /tmp/ionian_functional_tendency_hypothesis_test
          /tmp/ionian_functional_tendency_hypothesis_test
