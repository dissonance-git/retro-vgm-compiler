name: Component materialization

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "imports/MANIFEST.md"
      - "imports/bootstrap/**"
      - "imports/foo_snesapu/**"
      - "components/vgm/foo_input_vgm/**"
      - "components/vgm/enhancement/**"
      - "components/spc/**"
      - "patches/foo_input_vgm/**"
      - "patches/libvgm/**"
      - "patches/snesapu/**"
      - "tools/materialize_foo_input_vgm.py"
      - "tools/materialize_foo_snesapu.py"
      - "tools/reconstruct_vgm031_bootstrap.py"
      - "tests/integration/libvgm-source/**"
      - "tests/spc/test_materialize_foo_snesapu.py"
      - ".github/workflows/vgm-component-materialization.yml"

permissions:
  contents: read

jobs:
  materialize-windows:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify materializer tools
        shell: pwsh
        run: |
          python --version
          if ($LASTEXITCODE -ne 0) { throw 'Python is unavailable' }
          $sevenZip = Get-Command 7z -ErrorAction Stop
          & $sevenZip.Source | Out-Null

      - name: Validate pinned libvgm source contracts
        shell: pwsh
        run: |
          $libvgm = Join-Path $env:RUNNER_TEMP 'vgm-compiler-libvgm'
          $libvgmBuild = Join-Path $env:RUNNER_TEMP 'vgm-compiler-libvgm-source-tests'
          git clone https://github.com/ValleyBell/libvgm.git $libvgm
          if ($LASTEXITCODE -ne 0) { throw 'libvgm clone failed' }
          git -C $libvgm checkout 64e1de284e9a4305c54dd162ee8c33539a9bc0d1
          if ($LASTEXITCODE -ne 0) { throw 'pinned libvgm checkout failed' }

          python patches/libvgm/apply_source_capture.py $libvgm
          if ($LASTEXITCODE -ne 0) { throw 'libvgm source-aware patch chain failed' }

          cmake -S tests/integration/libvgm-source -B $libvgmBuild "-DLIBVGM_ROOT=$libvgm"
          if ($LASTEXITCODE -ne 0) { throw 'libvgm integration configure failed' }
          cmake --build $libvgmBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw 'libvgm integration build failed' }
          ctest --test-dir $libvgmBuild -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw 'libvgm integration tests failed' }

          $additivityExe = Join-Path $libvgmBuild 'Release\nukedopm_channel_additivity_falsifier.exe'
          $additivityLog = Join-Path $libvgmBuild 'nukedopm-channel-additivity.txt'
          $additivityOutput = & $additivityExe 2>&1
          $additivityExit = $LASTEXITCODE
          $additivityOutput | Tee-Object -FilePath $additivityLog
          if ($additivityExit -ne 0) { throw "Nuked-OPM additivity falsifier failed with $additivityExit" }

          $pairExe = Join-Path $libvgmBuild 'Release\ym2151_renderer_pair_probe.exe'
          $pairLog = Join-Path $libvgmBuild 'ym2151-renderer-pair.txt'
          $pairOutput = & $pairExe 2>&1
          $pairExit = $LASTEXITCODE
          $pairOutput | Tee-Object -FilePath $pairLog
          if ($pairExit -ne 0) { throw "YM2151 renderer pair probe failed with $pairExit" }

          "LIBVGM_TEST_BUILD=$libvgmBuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload YM2151 libvgm diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: ym2151-libvgm-diagnostics-${{ github.sha }}
          path: |
            ${{ env.LIBVGM_TEST_BUILD }}/nukedopm-channel-additivity.txt
            ${{ env.LIBVGM_TEST_BUILD }}/ym2151-renderer-pair.txt
          if-no-files-found: error
          retention-days: 14

      - name: Materialize canonical foo_input_vgm
        shell: pwsh
        run: |
          $sdkRoot = Join-Path $env:RUNNER_TEMP 'vgm-compiler-fb2k-sdk'
          python tools/materialize_foo_input_vgm.py --sdk-root $sdkRoot
          if ($LASTEXITCODE -ne 0) { throw 'foo_input_vgm materialization failed' }
          "VGM_SDK_ROOT=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify current VGM source-aware runtime landed
        shell: pwsh
        run: |
          $src = Join-Path $env:VGM_SDK_ROOT 'foo_input_vgm\src'
          $header = Get-Content (Join-Path $src 'input_vgm.h') -Raw
          $shadow = Get-Content (Join-Path $src 'input_vgm_shadow.cpp') -Raw
          foreach ($required in @(
            'genesis_selected_source_queue',
            'genesis_selected_source_block',
            'genesis_source_episode_transport',
            'genesis_source_spread_7_1',
            'surround_bed_7_1'
          )) {
            if ($header -notmatch [regex]::Escape($required)) {
              throw "materialized input_vgm.h missing current runtime marker: $required"
            }
          }
          foreach ($required in @(
            'capture_genesis_reference_sources',
            'render_genesis_surround_output',
            'm_genesis_surround_episodes.observe',
            'm_genesis_surround_episodes.prepare_delivered_block',
            'project_genesis_source_spread_7_1',
            'audio_chunk::channel_config_7point1',
            'cfg_vgm_enhanced_enabled'
          )) {
            if ($shadow -notmatch [regex]::Escape($required)) {
              throw "materialized input_vgm_shadow.cpp missing current runtime marker: $required"
            }
          }

          foreach ($retired in @(
            'genesis_spatial_route_transport',
            'genesis_realtime_musical_omniphony_pipeline',
            'render_genesis_spatial_output',
            'genesis_source_spread_depth_fraction'
          )) {
            if ($header -match [regex]::Escape($retired) -or
                $shadow -match [regex]::Escape($retired)) {
              throw "retired decoder-side spatial runtime is active: $retired"
            }
          }

      - name: Verify VGM project-owned support overlay
        shell: pwsh
        run: |
          $component = Join-Path $env:VGM_SDK_ROOT 'foo_input_vgm'
          $required = @(
            'Directory.Build.targets',
            'src\source_aware_vgm_player.h',
            'src\linear_source_resampler.h',
            'src\nuked_opn2_source_capture.h',
            '..\enhancement\genesis_selected_source_queue.h',
            '..\enhancement\genesis_selected_source_block.h',
            '..\enhancement\genesis_source_episode_7_1.h',
            '..\enhancement\genesis_source_spread_7_1.h'
          )
          foreach ($relative in $required) {
            $path = Join-Path $component $relative
            if (!(Test-Path $path)) { throw "materialized support file missing: $relative" }
          }

      - name: Materialize canonical foo_snesapu
        shell: pwsh
        run: |
          $spcRoot = Join-Path $env:RUNNER_TEMP 'vgm-compiler-foo-snesapu'
          python tools/materialize_foo_snesapu.py $spcRoot
          if ($LASTEXITCODE -ne 0) { throw 'foo_snesapu materialization failed' }
          "SPC_ROOT=$spcRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify current SPC source transport landed
        shell: pwsh
        run: |
          $parent = Join-Path $env:SPC_ROOT 'foobar2000\foo_snesapu'
          $child = Join-Path $env:SPC_ROOT 'spcplayer'
          $parentSource = Get-Content (Join-Path $parent 'spcplayer_controller.cpp') -Raw
          $parentInput = Get-Content (Join-Path $parent 'input_snesapu.cpp') -Raw
          $childHeader = Get-Content (Join-Path $child 'spcplayer.h') -Raw
          $childSource = Get-Content (Join-Path $child 'main.cpp') -Raw
          $ui = Get-Content (Join-Path $parent 'resource.rc') -Raw
          foreach ($required in @(
            'SPCP_HEADER_VERSION    3',
            'SPCP_HEADER_STUDIO_SIZE_OFFSET'
          )) {
            if ($childHeader -notmatch [regex]::Escape($required)) {
              throw "materialized child header missing current marker: $required"
            }
          }
          foreach ($required in @(
            '__stdcall retro_prebrr_callback',
            'SetDSPStudioSourceProvider',
            'invalid verified studio-source packet or BRR witness mismatch'
          )) {
            if ($childSource -notmatch [regex]::Escape($required)) {
              throw "materialized child source missing current marker: $required"
            }
          }
          foreach ($required in @('m_studio_source_size', 'SetStudioSourcePacket')) {
            if ($parentSource -notmatch [regex]::Escape($required)) {
              throw "materialized parent transport missing current marker: $required"
            }
          }
          foreach ($required in @(
            'RenderSurroundBlock',
            'ResetSurroundRuntime',
            'audio_chunk::channel_config_7point1',
            'EmuAPU_with_sources'
          )) {
            if ($parentInput -notmatch [regex]::Escape($required)) {
              throw "materialized parent runtime missing current marker: $required"
            }
          }
          if ($parentInput -match 'm_Enhancer\.reset\(\)') {
            throw 'unexpected SemanticStereoEnhancer seek state is present'
          }
          if ($ui -notmatch '"Surround"') {
            throw 'Surround control is missing from materialized SPC UI'
          }
          if ($ui -notmatch '"enhanced \(later\)"' -or
              $ui -notmatch 'WS_DISABLED') {
            throw 'later enhanced control is not visibly disabled in materialized SPC UI'
          }

      - name: Run focused SPC materializer regression
        shell: pwsh
        run: |
          python tests/spc/test_materialize_foo_snesapu.py
          if ($LASTEXITCODE -ne 0) { throw 'foo_snesapu regression failed' }

      - name: Upload materialized sources for diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: materialized-foobar-sources-${{ github.sha }}
          path: |
            ${{ env.VGM_SDK_ROOT }}/foo_input_vgm
            ${{ env.SPC_ROOT }}/foobar2000/foo_snesapu
            ${{ env.SPC_ROOT }}/spcplayer
          if-no-files-found: error
          retention-days: 7
