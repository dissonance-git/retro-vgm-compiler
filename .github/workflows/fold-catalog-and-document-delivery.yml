name: Fold catalog and document delivery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fold-catalog-and-document-delivery.yml"

permissions:
  contents: write

jobs:
  migrate-root-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded root documentation migration
        shell: bash
        run: |
          python tools/fold_root_docs_once.py
          python tools/fold_catalog_references_once.py

      - name: Validate migration
        shell: bash
        run: |
          git rm CATALOG.md
          if git grep -n 'CATALOG.md' -- ':!docs/history/**' ':!docs/generated/**' ':!.github/workflows/fold-catalog-and-document-delivery.yml' ':!tools/fold_root_docs_once.py' ':!tools/fold_catalog_references_once.py'; then
            echo 'Unexpected live CATALOG.md reference remains' >&2
            exit 1
          fi
          test -f tools/repository_catalog.py
          test -f docs/retro-vgm-compiler-roadmap.md
          test -f components/README.md
          test -f model/README.md
          test -f research/README.md
          test -f tools/README.md
          test -f docs/README.md
          test -f docs/omniphony-realtime-spatial-path.md
          git diff --check

      - name: Commit root documentation migration
        shell: bash
        run: |
          git config user.name dissonance
          git config user.email ustreamusa@aim.com
          git add -A
          git commit -m "docs: fold catalog and preserve component delivery workflow"
          git push origin HEAD:main
