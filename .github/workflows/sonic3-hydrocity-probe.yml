name: Sonic 3 Hydrocity attribution diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sonic3-hydrocity-probe.yml'

permissions:
  contents: write

jobs:
  hydrocity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configure forensic SPC runtime
        run: cmake -S tools/spc/forensic -B build-spc-forensic -DCMAKE_BUILD_TYPE=Release

      - name: Build forensic SPC runtime
        run: cmake --build build-spc-forensic --parallel 2

      - name: Build narrow opaque mixed panel
        run: |
          python3 - <<'PY'
          import json, pathlib
          base = pathlib.Path('research/projects/sonic3/spc-cube-blind-panel.json')
          panel = json.loads(base.read_text(encoding='utf-8'))
          target_dir = pathlib.Path('tests/corpus/sonic-3-knuckles')
          wanted = [
              '03 - Hydrocity Zone Act 1.vgz',
              '04 - Hydrocity Zone Act 2.vgz',
              '05 - Marble Garden Zone Act 1.vgz',
              '27 - Boss Theme.vgz',
          ]
          start = len(panel['cues']) + 1
          for offset, name in enumerate(wanted):
              path = target_dir / name
              if not path.is_file():
                  raise SystemExit(f'missing target fixture: {path}')
              panel['cues'].append({
                  'cue_id': f'cue-{start + offset:03d}',
                  'fixture_path': path.as_posix(),
              })
          out = pathlib.Path('hydrocity-probe/panel.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(panel, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'control_and_holdout_cues': start - 1, 'target_cues': len(wanted), 'total_cues': len(panel['cues'])}, sort_keys=True))
          PY

      - name: Capture creator-blind medium-continuity matrix
        run: |
          python3 -B tools/spc/capture_blind_panel.py \
            --panel hydrocity-probe/panel.json \
            --extractor build-spc-forensic/spc_forensic_features \
            --output-dir hydrocity-probe/sidecars \
            --freeze-output hydrocity-probe/frozen-matrix.json \
            --seconds 5 \
            --genesis-max-gap-ticks 2205 \
            --genesis-max-pitch-interval-octaves 1.5

      - name: Reveal only grounded control labels and score targets
        run: |
          python3 -B tools/spc/evaluate_cube_calibration.py \
            --freeze hydrocity-probe/frozen-matrix.json \
            --panel hydrocity-probe/panel.json \
            --admissions research/projects/sonic3/attribution-control-admissions.jsonl \
            --policy research/projects/sonic3/cube-calibration-policy.json \
            --output hydrocity-probe/cube-calibration.json

      - name: Build durable narrow result
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          evaluation_path = pathlib.Path('hydrocity-probe/cube-calibration.json')
          freeze_path = pathlib.Path('hydrocity-probe/frozen-matrix.json')
          data = json.loads(evaluation_path.read_text(encoding='utf-8'))
          world = data['validation_worlds']['sonic-3-knuckles']
          rows = []
          for item in world['cues']:
              scores = item['candidate_scores']
              rows.append({
                  'file': pathlib.PurePosixPath(item['fixture_path']).name,
                  'takaoka': scores.get('Miyoko Takaoka'),
                  'hikichi': scores.get('Masanori Hikichi'),
                  'winner': item.get('winner'),
                  'margin': item.get('winner_margin'),
                  'decisive': item.get('decisive'),
              })
          result = {
              'schema_version': 1,
              'status': 'narrow_creator_affinity_diagnostic',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'parameters': {'max_gap_ticks': 2205, 'max_pitch_interval_octaves': 1.5, 'spc_seconds': 5},
              'grounded_composer_control_count': 15,
              'claim_boundary': 'Creator-blind persistent-part motif affinity only. Hydrocity is not assigned to a composer by this diagnostic; Marble Garden Act 1 and Boss Theme are included only as post-freeze transfer sanity anchors. Genesis programming/arrangement evidence is outside this score.',
              'freeze_sha256': hashlib.sha256(freeze_path.read_bytes()).hexdigest(),
              'evaluation_sha256': hashlib.sha256(evaluation_path.read_bytes()).hexdigest(),
              'target_mean_candidate_affinity': world.get('mean_candidate_affinity'),
              'tracks': rows,
          }
          out = pathlib.Path('/tmp/sonic3-hydrocity-probe-2026-08-17.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, sort_keys=True))
          PY

      - name: Publish narrow diagnostic to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout --detach origin/main
          RESULT='research/projects/sonic3/execution/sonic3-hydrocity-probe-2026-08-17.json'
          test ! -e "$RESULT"
          mkdir -p "$(dirname "$RESULT")"
          cp /tmp/sonic3-hydrocity-probe-2026-08-17.json "$RESULT"
          git add "$RESULT"
          git commit -m 'research: record narrow Hydrocity attribution diagnostic'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
