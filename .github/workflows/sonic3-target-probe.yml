name: Sonic 3 mixed-source attribution probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sonic3-target-probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify mixed-source attribution contracts
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/spc -p 'test_capture_blind_panel_mixed_sources.py'
          python3 -B -m unittest discover -s tests/spc -p 'test_cube_cross_soundtrack_coverage.py'
          python3 -B -m unittest discover -s tests/spc -p 'test_cube_blind_panel_coverage.py'

      - name: Configure forensic SPC runtime
        run: cmake -S tools/spc/forensic -B build-spc-forensic -DCMAKE_BUILD_TYPE=Release

      - name: Build forensic SPC runtime
        run: cmake --build build-spc-forensic --parallel 2

      - name: Build opaque mixed panel with all Sonic 3 targets
        run: |
          python3 - <<'PY'
          import json, pathlib
          base = pathlib.Path('research/projects/sonic3/spc-cube-blind-panel.json')
          panel = json.loads(base.read_text(encoding='utf-8'))
          target_dir = pathlib.Path('tests/corpus/sonic-3-knuckles')
          targets = sorted(p for p in target_dir.iterdir() if p.is_file() and p.suffix.lower() in {'.vgm','.vgz'})
          start = len(panel['cues']) + 1
          panel['purpose'] = 'One-shot creator-blind mixed-source calibration plus held-out Sonic 3 target panel.'
          panel['claim_boundary'] = 'Opaque fixture identity and creator-blind motif evidence only; labels are revealed only by the evaluator.'
          for offset, path in enumerate(targets):
              panel['cues'].append({
                  'cue_id': f'cue-{start + offset:03d}',
                  'fixture_path': path.as_posix(),
              })
          out = pathlib.Path('sonic3-probe/panel.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(panel, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({'base_controls': start-1, 'sonic3_targets': len(targets), 'total_cues': len(panel['cues'])}, sort_keys=True))
          if len(targets) != 58:
              raise SystemExit(f'expected immutable 58-target Sonic 3 set, found {len(targets)}')
          PY

      - name: Capture and score continuity grid
        run: |
          set -euo pipefail
          for SPEC in '500 1.0 tight' '2205 1.5 medium' '8820 2.0 wide'; do
            set -- $SPEC
            GAP="$1"; PITCH="$2"; NAME="$3"
            mkdir -p "sonic3-probe/$NAME/sidecars" "sonic3-probe/$NAME/reveal"
            python3 -B tools/spc/capture_blind_panel.py \
              --panel sonic3-probe/panel.json \
              --extractor build-spc-forensic/spc_forensic_features \
              --output-dir "sonic3-probe/$NAME/sidecars" \
              --freeze-output "sonic3-probe/$NAME/frozen-matrix.json" \
              --seconds 5 \
              --genesis-max-gap-ticks "$GAP" \
              --genesis-max-pitch-interval-octaves "$PITCH"
            python3 -B tools/spc/evaluate_cube_calibration.py \
              --freeze "sonic3-probe/$NAME/frozen-matrix.json" \
              --panel sonic3-probe/panel.json \
              --admissions research/projects/sonic3/attribution-control-admissions.jsonl \
              --policy research/projects/sonic3/cube-calibration-policy.json \
              --output "sonic3-probe/$NAME/reveal/cube-calibration.json"
          done

      - name: Audit Genesis realization coordinate separately
        run: |
          set -euo pipefail
          python3 -B tools/cross_soundtrack_vgm_audit.py \
            tests/corpus/sonic-3-knuckles \
            --include-within-soundtrack \
            --neighbors 3 \
            --json sonic3-probe/genesis-realization-audit.json >/dev/null

      - name: Build compact durable result
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, importlib.util, json, os, pathlib, re, sys

          specs = {
              'tight': {'max_gap_ticks': 500, 'max_pitch_interval_octaves': 1.0},
              'medium': {'max_gap_ticks': 2205, 'max_pitch_interval_octaves': 1.5},
              'wide': {'max_gap_ticks': 8820, 'max_pitch_interval_octaves': 2.0},
          }
          panel = json.loads(pathlib.Path('sonic3-probe/panel.json').read_text(encoding='utf-8'))
          fixture_to_cue = {pathlib.PurePosixPath(c['fixture_path']).name: c['cue_id'] for c in panel['cues']}
          target_names = sorted(
              pathlib.PurePosixPath(c['fixture_path']).name
              for c in panel['cues']
              if c['fixture_path'].startswith('tests/corpus/sonic-3-knuckles/')
          )

          runs = {}
          keyed = {}
          frozen_matrices = {}
          for name, spec in specs.items():
              eval_path = pathlib.Path(f'sonic3-probe/{name}/reveal/cube-calibration.json')
              freeze_path = pathlib.Path(f'sonic3-probe/{name}/frozen-matrix.json')
              data = json.loads(eval_path.read_text(encoding='utf-8'))
              frozen = json.loads(freeze_path.read_text(encoding='utf-8'))
              frozen_matrices[name] = frozen['similarity_matrix']
              world = data['validation_worlds']['sonic-3-knuckles']
              rows = []
              for item in world['cues']:
                  scores = item['candidate_scores']
                  rows.append({
                      'file': pathlib.PurePosixPath(item['fixture_path']).name,
                      'takaoka': scores.get('Miyoko Takaoka'),
                      'hikichi': scores.get('Masanori Hikichi'),
                      'winner': item.get('winner'),
                      'margin': item.get('winner_margin'),
                      'decisive': item.get('decisive'),
                  })
              keyed[name] = {row['file']: row for row in rows}
              runs[name] = {
                  'parameters': spec,
                  'freeze_sha256': hashlib.sha256(freeze_path.read_bytes()).hexdigest(),
                  'evaluation_sha256': hashlib.sha256(eval_path.read_bytes()).hexdigest(),
                  'target_mean_candidate_affinity': world.get('mean_candidate_affinity'),
                  'tracks': rows,
              }

          stability = []
          for file in sorted(keyed['medium']):
              winners = [keyed[name][file]['winner'] for name in specs]
              decisive = [keyed[name][file]['decisive'] for name in specs]
              margins = [keyed[name][file]['margin'] for name in specs]
              stability.append({
                  'file': file,
                  'winners': winners,
                  'decisive': decisive,
                  'margins': margins,
                  'stable_winner': len(set(winners)) == 1,
                  'decisive_all': all(bool(value) for value in decisive),
              })

          def stem(file_name):
              value = pathlib.PurePosixPath(file_name).stem
              return re.sub(r'^\d+\s*-\s*', '', value)

          by_stem = {stem(name): name for name in target_names}
          pair_specs = []
          seen = set()

          for base, beta_file in sorted(by_stem.items()):
              if not base.endswith(' (Beta)'):
                  continue
              retail_base = base[:-7]
              retail_file = by_stem.get(retail_base)
              if retail_file:
                  key = tuple(sorted((retail_file, beta_file)))
                  if key not in seen:
                      seen.add(key)
                      pair_specs.append(('retail_beta', retail_file, beta_file))

          act_re = re.compile(r'^(.*) Act ([12])( \(Beta\))?$')
          grouped = {}
          for base, file_name in by_stem.items():
              match = act_re.match(base)
              if not match:
                  continue
              group = (match.group(1), bool(match.group(3)))
              grouped.setdefault(group, {})[int(match.group(2))] = file_name
          for (family, is_beta), acts in sorted(grouped.items()):
              if 1 in acts and 2 in acts:
                  key = tuple(sorted((acts[1], acts[2])))
                  if key not in seen:
                      seen.add(key)
                      pair_specs.append(('act1_act2_beta' if is_beta else 'act1_act2_retail', acts[1], acts[2]))

          audit_path = pathlib.Path('sonic3-probe/genesis-realization-audit.json')
          audit = json.loads(audit_path.read_text(encoding='utf-8'))
          audit_tracks = {row['file']: row for row in audit['tracks']}
          tool_path = pathlib.Path('tools/vgm_creator_feature_audit.py')
          spec = importlib.util.spec_from_file_location('probe_vgm_audit', tool_path)
          if spec is None or spec.loader is None:
              raise RuntimeError('could not load VGM audit scorer')
          audit_mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = audit_mod
          spec.loader.exec_module(audit_mod)

          pair_results = []
          for kind, a, b in pair_specs:
              cue_a = fixture_to_cue[a]
              cue_b = fixture_to_cue[b]
              pair_results.append({
                  'kind': kind,
                  'a': a,
                  'b': b,
                  'composer_facing_motif_similarity': {
                      name: frozen_matrices[name][cue_a][cue_b] for name in specs
                  },
                  'genesis_structural_similarity': audit_mod.structural_similarity(audit_tracks[a], audit_tracks[b]),
                  'genesis_realization_similarity': audit_mod.realization_similarity(audit_tracks[a], audit_tracks[b]),
              })

          structural_neighbors = audit['top_structural_neighbors']
          realization_neighbors = audit['top_realization_neighbors']
          target_prefix = 'sonic-3-knuckles::'
          execution_neighbors = {}
          for file in target_names:
              key = target_prefix + file
              execution_neighbors[file] = {
                  'structural': structural_neighbors.get(key, []),
                  'realization': realization_neighbors.get(key, []),
              }

          selected_tokens = (
              'Hydrocity', 'Carnival Night', 'IceCap', 'Launch Base', 'Sky Sanctuary',
              'Data Select', 'Balloon Park', "Knuckles' Theme", 'Mushroom Hill',
              'Marble Garden', 'Boss Theme', 'Doomsday', 'Flying Battery',
              'Sandopolis', 'Death Egg', 'Competition Menu'
          )
          selected = {}
          for file in target_names:
              if any(token in file for token in selected_tokens):
                  selected[file] = {
                      'affinity_by_setting': {name: keyed[name][file] for name in specs},
                      'execution_neighbors': execution_neighbors[file],
                  }

          result = {
              'schema_version': 1,
              'status': 'tentative_creator_affinity_probe',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'target_corpus': 'tests/corpus/sonic-3-knuckles',
              'target_count': len(target_names),
              'grounded_composer_control_count': 15,
              'candidates': ['Miyoko Takaoka', 'Masanori Hikichi'],
              'claim_boundary': 'Creator-blind mixed-source persistent-part motif affinity only. This is not authorship proof. Current Hikichi cross-soundtrack coverage is incomplete; Gleylancer remains a future confidence upgrade rather than a gate. Genesis structural/realization similarity is reported separately and must not be promoted into composer identity.',
              'parameter_order': list(specs),
              'runs': runs,
              'stability': stability,
              'pair_controls': pair_results,
              'genesis_execution_coordinate': {
                  'audit_sha256': hashlib.sha256(audit_path.read_bytes()).hexdigest(),
                  'claim_boundary': audit.get('claim_boundary'),
                  'neighbors': execution_neighbors,
              },
              'selected_targets': selected,
          }
          out = pathlib.Path('/tmp/sonic3-target-probe-2026-08-17.json')
          out.write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'target_count': result['target_count'],
              'pair_control_count': len(pair_results),
              'stable_winner_count': sum(item['stable_winner'] for item in stability),
              'decisive_all_count': sum(item['decisive_all'] for item in stability),
              'selected_target_count': len(selected),
              'output_sha256': hashlib.sha256(out.read_bytes()).hexdigest(),
          }, sort_keys=True))
          if result['target_count'] != 58:
              raise SystemExit('target count changed during result assembly')
          PY

      - name: Upload exact probe artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sonic3-mixed-source-attribution-probe
          retention-days: 30
          path: sonic3-probe/
          if-no-files-found: error

      - name: Publish compact result to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git checkout --detach origin/main
          RESULT='research/projects/sonic3/execution/sonic3-target-probe-2026-08-17.json'
          test ! -e "$RESULT"
          mkdir -p "$(dirname "$RESULT")"
          cp /tmp/sonic3-target-probe-2026-08-17.json "$RESULT"
          git add "$RESULT"
          git commit -m 'research: record first Sonic 3 mixed-source attribution probe'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
