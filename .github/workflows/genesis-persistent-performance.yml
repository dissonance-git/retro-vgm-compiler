name: Genesis persistent performance

on:
  push:
    branches: [main]
    paths:
      - 'model/persistent_part_performance_trajectory.h'
      - 'components/vgm/enhancement/genesis_part_evidence.h'
      - 'components/vgm/enhancement/genesis_persistent_performance_adapter.h'
      - 'tests/vgm/genesis_persistent_performance_adapter_test.cpp'
      - 'cmake/semantic_model_tests.cmake'
      - '.github/workflows/genesis-persistent-performance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair latent Genesis evidence header
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('components/vgm/enhancement/genesis_part_evidence.h')
          text = path.read_text(encoding='utf-8')
          old = '''inline std::optional<double> genesis_relative_pitch_coordinate(
              const vgmtooling::model::node& onset) noexcept {
              const attribute* family_item = find_genesis_part_attribute(onset, "device_family");'''
          new = '''inline std::optional<double> genesis_relative_pitch_coordinate(
              const vgmtooling::model::node& onset) noexcept {
              using vgmtooling::model::attribute;

              const attribute* family_item = find_genesis_part_attribute(onset, "device_family");'''
          if old in text:
              if text.count(old) != 1:
                  raise SystemExit('Genesis evidence header repair anchor is not singular')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif new not in text:
              raise SystemExit('Genesis evidence header repair anchor not found')
          PY

      - name: Register compiler regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('cmake/semantic_model_tests.cmake')
          text = path.read_text(encoding='utf-8')
          marker = 'genesis_persistent_performance_adapter_test'
          if marker not in text:
              text += r'''

          # Source-backed Genesis persistent-part performed trajectory regression.
          list(APPEND GAMEAUDIO_TEST_TARGETS
              genesis_persistent_performance_adapter_test
          )

          add_executable(
              genesis_persistent_performance_adapter_test
              tests/vgm/genesis_persistent_performance_adapter_test.cpp
          )

          target_include_directories(
              genesis_persistent_performance_adapter_test
              PRIVATE ${CMAKE_CURRENT_SOURCE_DIR}
          )

          add_test(
              NAME genesis_persistent_performance_adapter
              COMMAND genesis_persistent_performance_adapter_test
          )
          '''
              path.write_text(text, encoding='utf-8')
          PY

      - name: Configure compiler core
        run: cmake -S . -B build -DGAMEAUDIO_BUILD_CORE_TESTS=ON

      - name: Build focused compiler regressions
        run: >-
          cmake --build build --parallel
          --target
          genesis_persistent_performance_adapter_test
          persistent_part_performance_trajectory_test
          pitch_motion_articulation_test

      - name: Run focused compiler regressions
        run: >-
          ctest --test-dir build --output-on-failure
          -R 'genesis_persistent_performance_adapter|persistent_part_performance_trajectory|pitch_motion_articulation'

      - name: Validate focused changes
        run: |
          git diff --check
          grep -q 'genesis_persistent_performance_adapter_test' cmake/semantic_model_tests.cmake
          grep -q 'using vgmtooling::model::attribute;' components/vgm/enhancement/genesis_part_evidence.h

      - name: Commit permanent compiler path
        run: |
          if git diff --quiet -- cmake/semantic_model_tests.cmake components/vgm/enhancement/genesis_part_evidence.h; then
            exit 0
          fi
          git config user.name dissonance
          git config user.email ustreamusa@aim.com
          git add cmake/semantic_model_tests.cmake components/vgm/enhancement/genesis_part_evidence.h
          git commit -m 'fix(genesis): compile persistent performance evidence path'
          git push
