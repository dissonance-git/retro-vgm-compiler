name: core-tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-free-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Project identity
        run: python3 -B tools/check_project_identity.py

      - name: Repository structural contracts
        run: python3 -B tests/test_cmake_registration_uniqueness.py

      - name: Source-family Python audits
        run: |
          python3 -B -m unittest discover -s tests/vgm -p 'test_*.py'
          python3 -B -m unittest discover -s tests/spc -p 'test_*.py'

      - name: Behavioral equivalence controls
        run: |
          python3 -B tools/nes_pulse_behavioral_equivalence.py
          python3 -B tools/signed_routing_phase_control.py

      - name: Full dependency-free core
        run: python3 -B tests/run_full_core_suite.py --config Release
