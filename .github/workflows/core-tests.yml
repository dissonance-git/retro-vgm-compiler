name: core-tests

# GitHub-hosted runners are currently blocked by the account billing/spending
# limit before jobs start. Keep the workflow available for manual validation
# without painting every development commit red until runner access is restored.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-free-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: VGM Python audits
        run: python3 -B -m unittest discover -s tests/vgm -p 'test_*.py'
      - name: SPC Python audits
        run: python3 -B -m unittest discover -s tests/spc -p 'test_*.py'
      - name: Spatial source authority contract
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/model/spatial_source_test.cpp -o /tmp/spatial_source_test
          /tmp/spatial_source_test
      - name: QSound source controls and native evidence sidecars
        run: |
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_spatial_source_test.cpp -o /tmp/qsound_spatial_source_test
          /tmp/qsound_spatial_source_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_control_capture_test.cpp -o /tmp/qsound_control_capture_test
          /tmp/qsound_control_capture_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_environment_control_state_test.cpp -o /tmp/qsound_environment_control_state_test
          /tmp/qsound_environment_control_state_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_environment_control_replay_test.cpp -o /tmp/qsound_environment_control_replay_test
          /tmp/qsound_environment_control_replay_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_native_source_capture_test.cpp -o /tmp/qsound_native_source_capture_test
          /tmp/qsound_native_source_capture_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_native_mix_capture_test.cpp -o /tmp/qsound_native_mix_capture_test
          /tmp/qsound_native_mix_capture_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_native_time_map_test.cpp -o /tmp/qsound_native_time_map_test
          /tmp/qsound_native_time_map_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_native_source_window_test.cpp -o /tmp/qsound_native_source_window_test
          /tmp/qsound_native_source_window_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_native_linear_projection_test.cpp -o /tmp/qsound_native_linear_projection_test
          /tmp/qsound_native_linear_projection_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_consumer_source_block_test.cpp -o /tmp/qsound_consumer_source_block_test
          /tmp/qsound_consumer_source_block_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_echo_input_recomposition_test.cpp -o /tmp/qsound_echo_input_recomposition_test
          /tmp/qsound_echo_input_recomposition_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_echo_state_test.cpp -o /tmp/qsound_echo_state_test
          /tmp/qsound_echo_state_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror -I. \
            tests/vgm/qsound_reference_recomposition_test.cpp -o /tmp/qsound_reference_recomposition_test
          /tmp/qsound_reference_recomposition_test
      - name: Behavioral equivalence controls
        run: |
          python3 -B tools/nes_pulse_behavioral_equivalence.py
          python3 -B tools/signed_routing_phase_control.py
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
