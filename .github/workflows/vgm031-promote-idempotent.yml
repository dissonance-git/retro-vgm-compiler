name: Promote VGM 0.31 idempotently

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/vgm031-promote-idempotent.yml"

permissions:
  contents: write

concurrency:
  group: vgm031-bootstrap-promotion-v2
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify or migrate exact 0.31 ownership
        run: python .ci-temp/promote_vgm031_idempotent.py

      - name: Validate promoted state
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/materialize_foo_input_vgm.py
          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          python -B -m unittest discover -s tests/vgm -p 'test_*.py'
          git diff --check

      - name: Publish canonical state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git rm -r -f .bootstrap-transfer || true
          git rm -r -f .ci-temp || true
          git rm -f .github/workflows/vgm031-bootstrap-repair.yml || true
          git rm -f .github/workflows/vgm031-bootstrap-promote.yml || true
          git rm -f .github/workflows/vgm031-promote-now.yml || true
          git rm -f .github/workflows/vgm031-promote-debug.yml || true
          git rm -f .github/workflows/vgm031-promote-idempotent.yml || true
          git add imports/foo_input_vgm-0.31.zip \
                  tools/build_private_foobar_components.ps1 \
                  tools/materialize_foo_input_vgm.py \
                  imports/MANIFEST.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Canonical 0.31 state already published; nothing to commit.'
          else
            git commit -m "build: promote verified foo_input_vgm 0.31 bootstrap"
            git push origin HEAD:main
          fi
