name: Promote exact VGM 0.31 bootstrap

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/vgm031-bootstrap-promote.yml"
  workflow_dispatch:

permissions:
  contents: write
  statuses: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Publish locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"vgm031-exact-promote\",\"description\":\"run_id=$RUN_ID; validating exact source\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null

      - name: Reconstruct and patch exact 0.31 source
        run: python .bootstrap-transfer/promote_vgm031.py

      - name: Validate VGM materialization contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/materialize_foo_input_vgm.py
          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          python -B -m unittest discover -s tests/vgm -p 'test_*.py'
          git diff --check

      - name: Publish canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"
          git rm -r .bootstrap-transfer
          git rm -f .github/workflows/vgm031-bootstrap-repair.yml
          git rm -f .github/workflows/vgm031-bootstrap-promote.yml
          git add imports/foo_input_vgm-0.31.zip \
                  tools/build_private_foobar_components.ps1 \
                  tools/materialize_foo_input_vgm.py \
                  imports/MANIFEST.md
          git diff --cached --check
          git commit -m "build: promote verified foo_input_vgm 0.31 bootstrap"
          git push origin HEAD:main

      - name: Publish final status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = success ]; then state=success; else state=failure; fi
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$SOURCE_SHA" \
            -d "{\"state\":\"$state\",\"context\":\"vgm031-exact-promote\",\"description\":\"run_id=$RUN_ID; $JOB_STATUS\",\"target_url\":\"https://github.com/$REPOSITORY/actions/runs/$RUN_ID\"}" >/dev/null
