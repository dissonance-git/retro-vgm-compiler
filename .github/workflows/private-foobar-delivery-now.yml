name: Repair and build private foobar runtime

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/private-foobar-delivery-now.yml"

permissions:
  contents: write

env:
  PRIVATE_BUILD_TAG: private-foobar-latest

jobs:
  repair-and-build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair exact foo_input_vgm 0.31 baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path '.ci-temp/promote_vgm031_idempotent.py') {
            python .ci-temp/promote_vgm031_idempotent.py
          } else {
            python -c "from pathlib import Path; import hashlib; p=Path('imports/foo_input_vgm-0.31.zip'); assert p.is_file(); b=p.read_bytes(); assert len(b)==66250; assert hashlib.sha256(b).hexdigest()=='e2c08ee82b10efd3b31f2304d0c9a7c0f5eae0e07a241e91108c81c3bedd01e1'"
          }
          python -m py_compile tools/materialize_foo_input_vgm.py
          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          python -B -m unittest discover -s tests/vgm -p 'test_*.py'
          git diff --check

      - name: Publish clean canonical repair commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"

          if (Test-Path '.bootstrap-transfer') { git rm -r -f .bootstrap-transfer }
          if (Test-Path '.ci-temp') { git rm -r -f .ci-temp }
          foreach ($path in @(
            '.github/workflows/vgm031-bootstrap-repair.yml',
            '.github/workflows/vgm031-bootstrap-promote.yml',
            '.github/workflows/vgm031-promote-now.yml',
            '.github/workflows/vgm031-promote-debug.yml',
            '.github/workflows/vgm031-promote-idempotent.yml',
            '.github/workflows/private-foobar-delivery-now.yml'
          )) {
            if (Test-Path $path) { git rm -f $path }
          }

          git add imports/foo_input_vgm-0.31.zip tools/build_private_foobar_components.ps1 tools/materialize_foo_input_vgm.py imports/MANIFEST.md
          git diff --cached --check
          if (-not (git diff --cached --quiet)) {
            git commit -m "build: promote verified foo_input_vgm 0.31 bootstrap"
          }

          git fetch origin main
          $head = (git rev-parse HEAD).Trim()
          $remote = (git rev-parse origin/main).Trim()
          if ($head -ne $remote) {
            git rebase origin/main
          }
          git push origin HEAD:main
          git status --short
          if (git status --porcelain) { throw 'working tree is not clean after canonical repair publication' }

      - name: Ensure Windows build prerequisites
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "C:\Program Files\7-Zip;$env:Path"
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) { choco install 7zip -y --no-progress }
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://win.rustup.rs/x86_64 -OutFile rustup-init.exe
            .\rustup-init.exe -y --profile minimal
            $env:Path = "$env:USERPROFILE\.cargo\bin;$env:Path"
          }
          foreach ($cmd in @('git','python','cmake','ctest','rustup','cargo','nasm','7z')) {
            if (-not (Get-Command $cmd -ErrorAction SilentlyContinue)) { throw "missing build prerequisite after setup: $cmd" }
          }

      - name: Build and audit both private foobar components
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:Path = "C:\Program Files\7-Zip;$env:USERPROFILE\.cargo\bin;$env:Path"
          & .\tools\build_private_foobar_components.ps1 *>&1 | Tee-Object -FilePath private-foobar-build.log
          if ($LASTEXITCODE -ne 0) { throw "canonical private foobar builder failed with exit code $LASTEXITCODE" }

      - name: Verify final bundle exists
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Resolve-Path 'dist\private-components'
          $required = @(
            'foo_input_vgm.private.fb2k-component',
            'foo_snesapu.private.fb2k-component',
            'private-foobar-vgm-spc.zip',
            'build-manifest.json',
            'SHA256SUMS.txt',
            'README.txt'
          )
          foreach ($name in $required) {
            $path = Join-Path $root $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing final build output: $name" }
          }
          python .\tools\verify_private_component_packages.py `
            (Join-Path $root 'foo_input_vgm.private.fb2k-component') `
            (Join-Path $root 'foo_snesapu.private.fb2k-component')
          python .\tools\verify_private_component_bundle.py (Join-Path $root 'private-foobar-vgm-spc.zip')
          Get-FileHash (Join-Path $root 'private-foobar-vgm-spc.zip') -Algorithm SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: private-foobar-vgm-spc
          path: |
            dist/private-components/foo_input_vgm.private.fb2k-component
            dist/private-components/foo_snesapu.private.fb2k-component
            dist/private-components/private-foobar-vgm-spc.zip
            dist/private-components/build-manifest.json
            dist/private-components/SHA256SUMS.txt
            dist/private-components/README.txt
            private-foobar-build.log
          if-no-files-found: error
          retention-days: 14

      - name: Publish private prerelease asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:PRIVATE_BUILD_TAG
          $bundle = 'dist\private-components\private-foobar-vgm-spc.zip'
          $vgm = 'dist\private-components\foo_input_vgm.private.fb2k-component'
          $spc = 'dist\private-components\foo_snesapu.private.fb2k-component'
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag $bundle $vgm $spc --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit $tag --prerelease --title 'Private foobar runtime' --notes 'Private audited VGM + SPC foobar2000 runtime. Not a public product release.' --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag $bundle $vgm $spc --target main --prerelease --title 'Private foobar runtime' --notes 'Private audited VGM + SPC foobar2000 runtime. Not a public product release.' --repo $env:GITHUB_REPOSITORY
          }
