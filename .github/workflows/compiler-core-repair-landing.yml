name: Compiler core repair landing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compiler-core-repair-landing.yml'

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Preserve independently landed fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tools/repair_core_verification.py')
          text = path.read_text(encoding='utf-8')
          for start_marker, end_marker in (
              (
                  '# True default construction without permitting numeric implicit conversion.',
                  'replace_once(\n    "components/vgm/enhancement/genesis_pitch_control_adapter.h",',
              ),
              (
                  '# The patch script contains both predecessor and successor strings.',
                  '# Initial device attachment has a proven zero-valued negative-time FM prefix,',
              ),
              (
                  "# A period-16 square's aliased energy folds onto the same FFT bins as its legal",
                  'print("core verification repair staged")',
              ),
          ):
              start = text.find(start_marker)
              end = text.find(end_marker, start if start >= 0 else 0)
              if start < 0 or end < 0 or end <= start:
                  raise SystemExit(f'repair helper markers missing: {start_marker}')
              text = text[:start] + end_marker + text[end + len(end_marker):]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Stage verified repairs
        run: python tools/repair_core_verification.py
      - name: Configure full compiler core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAMEAUDIO_BUILD_CORE_TESTS=ON
      - name: Build full compiler core
        run: cmake --build build --parallel 2 -- -k
      - name: Run all core tests
        run: ctest --test-dir build --output-on-failure
      - name: Validate diff
        run: |
          git diff --check
          grep -q -- '-UNDEBUG' CMakeLists.txt
          grep -q 'schema_version.*4' tests/model/test_cube_evidence_worlds.py
          grep -q 'schema_version.*4' tests/spc/test_cube_panel_repository_contract.py
          grep -q 'bandlimited_square_error' tests/vgm/sn76489_alias_test.cpp
          grep -q 'startup_reference_frames == 0' tests/vgm/studio_source_resampler_test.cpp
      - name: Commit green repair set
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name dissonance
          git config user.email ustreamusa@aim.com
          git add -u
          git commit -m 'test(core): restore full semantic verification'
          git push
