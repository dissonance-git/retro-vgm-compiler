name: spc-runtime-corpus-pressure

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/spc-runtime-corpus-pressure.yml"
      - "components/spc/**"
      - "model/**"
      - "tools/spc/forensic/**"
      - "tools/spc/patch_snes_spc_forensic.py"
      - "tools/spc/runtime_corpus_pressure.py"
      - "tests/spc/**"
      - "tests/corpus/ancient-magic-spc/**"
      - "tests/corpus/america-oudan-ultra-quiz-spc/**"
      - "tests/corpus/battle-master-spc/**"
      - "tests/corpus/terranigma-spc/**"
      - "research/projects/sonic3/spc-cube-blind-panel.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-runtime-pressure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Runtime pressure contract tests
        run: python3 -B -m unittest discover -s tests/spc -p 'test_runtime_corpus_pressure.py'

      - name: Configure pinned forensic runtime
        run: cmake -S tools/spc/forensic -B build-spc-runtime-pressure -DCMAKE_BUILD_TYPE=Release

      - name: Build label-blind feature extractor and selectivity control
        run: >-
          cmake --build build-spc-runtime-pressure --parallel 2
          --target spc_forensic_features spc_part_selectivity_control

      - name: Run preregistered SPC runtime corpus pressure
        timeout-minutes: 10
        run: |
          python3 -B tools/spc/runtime_corpus_pressure.py \
            --extractor build-spc-runtime-pressure/spc_forensic_features \
            --output-dir spc-runtime-pressure/sidecars \
            --progress spc-runtime-pressure/progress.json \
            --summary spc-runtime-pressure/summary.json \
            --fixture-timeout-seconds 120 \
            --seconds 3 \
            "tests/corpus/ancient-magic-spc/05 - Battle.spc" \
            "tests/corpus/america-oudan-ultra-quiz-spc/06 - Guam Wind.spc" \
            "tests/corpus/battle-master-spc/01 - Opening.spc" \
            "tests/corpus/terranigma-spc/03 - Hometown.spc"

      # Measurement-only. The four-fixture ablation showed that pairwise
      # source/timing/pitch evidence is non-selective and that two-sided flanking
      # remains common. Broaden only the surviving one-in/one-out discriminator
      # across the preregistered creator-blind panel; do not turn this result into
      # an acceptance margin on the corpus that measured it.
      - name: Measure handoff context across blind SPC panel
        timeout-minutes: 5
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          panel_path = Path("research/projects/sonic3/spc-cube-blind-panel.json")
          panel = json.loads(panel_path.read_text(encoding="utf-8"))
          cues = panel["cues"]
          if len(cues) != 31:
              raise SystemExit(f"expected 31 blind-panel cues, found {len(cues)}")

          output_dir = Path("spc-runtime-pressure")
          output_dir.mkdir(parents=True, exist_ok=True)
          panel_rows = []
          raw_lines = []
          edge_lines = []
          seen = set()

          for cue in cues:
              cue_id = cue["cue_id"]
              fixture = Path(cue["fixture_path"])
              if cue_id in seen:
                  raise SystemExit(f"duplicate blind-panel cue id: {cue_id}")
              seen.add(cue_id)
              if not fixture.is_file():
                  raise SystemExit(f"missing blind-panel fixture: {cue_id}")

              completed = subprocess.run(
                  [
                      "build-spc-runtime-pressure/spc_part_selectivity_control",
                      str(fixture),
                      "3",
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              line = completed.stdout.strip()
              fields = line.split()
              if not fields or fields[0] != "SPC_PART_SELECTIVITY_CONTROL":
                  raise SystemExit(
                      f"unexpected handoff-context output for {cue_id}: {line}"
                  )

              values = {}
              for field in fields[1:]:
                  key, value = field.split("=", 1)
                  values[key] = (
                      float(value)
                      if any(char in value for char in ".eE")
                      else int(value)
                  )

              panel_rows.append({"cue_id": cue_id, **values})
              raw_lines.append(f"{cue_id} {line}")
              print(f"{cue_id} {line}")

              for detail_line in completed.stderr.splitlines():
                  if not detail_line.startswith("SPC_HANDOFF_EDGE "):
                      if detail_line.strip():
                          raise SystemExit(
                              f"unexpected handoff diagnostic for {cue_id}: {detail_line}"
                          )
                      continue
                  tagged = f"{cue_id} {detail_line}"
                  edge_lines.append(tagged)
                  print(tagged)

          (output_dir / "handoff-context.txt").write_text(
              "\n".join(raw_lines) + "\n",
              encoding="utf-8",
          )
          (output_dir / "handoff-panel.tsv").write_text(
              "\n".join(
                  f"{cue['cue_id']}\t{cue['fixture_path']}" for cue in cues
              ) + "\n",
              encoding="utf-8",
          )

          (output_dir / "handoff-edge-details.txt").write_text(
              ("\n".join(edge_lines) + "\n") if edge_lines else "",
              encoding="utf-8",
          )

          summary = {
              "schema": "spc-handoff-context-panel-v1",
              "claim_boundary": (
                  "Measurement-only data-association pressure. Unique local runtime "
                  "association is not persistent-part identity and cannot lift the "
                  "cross-voice confidence ceiling without independent evidence."
              ),
              "cue_count": len(panel_rows),
              "two_sided_unique_detail_count": len(edge_lines),
              "cues_with_observed_candidates": sum(
                  row["observed_candidates"] > 0 for row in panel_rows
              ),
              "cues_with_bundle_candidates": sum(
                  row["handoff_bundle_candidates"] > 0 for row in panel_rows
              ),
              "total_bundle_candidates": sum(
                  row["handoff_bundle_candidates"] for row in panel_rows
              ),
              "total_two_sided_flanked": sum(
                  row["handoff_two_sided_flanked"] for row in panel_rows
              ),
              "total_bidirectional_unique": sum(
                  row["handoff_bidirectional_unique"] for row in panel_rows
              ),
              "total_two_sided_unique": sum(
                  row["handoff_two_sided_unique"] for row in panel_rows
              ),
              "total_boundary_safe_bidirectional_unique": sum(
                  row["handoff_boundary_safe_bidirectional_unique"]
                  for row in panel_rows
              ),
              "total_boundary_safe_two_sided_unique": sum(
                  row["handoff_boundary_safe_two_sided_unique"]
                  for row in panel_rows
              ),
              "total_synchronized_cycle_two_sided_unique": sum(
                  row["handoff_synchronized_cycle_two_sided_unique"]
                  for row in panel_rows
              ),
              "total_noncyclic_two_sided_unique": sum(
                  row["handoff_noncyclic_two_sided_unique"]
                  for row in panel_rows
              ),
              "total_boundary_safe_noncyclic_two_sided_unique": sum(
                  row["handoff_boundary_safe_noncyclic_two_sided_unique"]
                  for row in panel_rows
              ),
              "total_same_voice_competed_two_sided_unique": sum(
                  row["handoff_same_voice_competed_two_sided_unique"]
                  for row in panel_rows
              ),
              "total_uncontested_two_sided_unique": sum(
                  row["handoff_uncontested_two_sided_unique"]
                  for row in panel_rows
              ),
              "total_boundary_safe_uncontested_two_sided_unique": sum(
                  row["handoff_boundary_safe_uncontested_two_sided_unique"]
                  for row in panel_rows
              ),
              "cues_with_bidirectional_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_bidirectional_unique"] > 0
              ],
              "cues_with_two_sided_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_two_sided_unique"] > 0
              ],
              "cues_with_boundary_safe_bidirectional_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_boundary_safe_bidirectional_unique"] > 0
              ],
              "cues_with_boundary_safe_two_sided_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_boundary_safe_two_sided_unique"] > 0
              ],
              "cues_with_synchronized_cycle_two_sided_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_synchronized_cycle_two_sided_unique"] > 0
              ],
              "cues_with_noncyclic_two_sided_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_noncyclic_two_sided_unique"] > 0
              ],
              "cues_with_boundary_safe_noncyclic_two_sided_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_boundary_safe_noncyclic_two_sided_unique"] > 0
              ],
              "cues_with_uncontested_two_sided_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_uncontested_two_sided_unique"] > 0
              ],
              "cues_with_boundary_safe_uncontested_two_sided_unique": [
                  row["cue_id"] for row in panel_rows
                  if row["handoff_boundary_safe_uncontested_two_sided_unique"] > 0
              ],
          }
          (output_dir / "handoff-context-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("SPC_HANDOFF_CONTEXT_PANEL", summary)
          PY

      - name: Upload bounded SPC pressure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: spc-runtime-corpus-pressure
          path: spc-runtime-pressure/
          if-no-files-found: warn
