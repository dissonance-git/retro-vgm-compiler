name: spc-forensic

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Controlled execution seconds per SPC fixture
        required: true
        default: "5"

permissions:
  contents: read

jobs:
  instrumented-spc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patcher integrity regression
        run: python3 -B -m unittest discover -s tests/spc -p 'test_snes_spc_runtime_patcher.py'

      - name: Blind freeze regression
        run: python3 -B -m unittest discover -s tests/spc -p 'test_freeze_forensic_sidecars.py'

      - name: Cube calibration boundary regression
        run: python3 -B -m unittest discover -s tests/spc -p 'test_cube_blind_panel.py'

      - name: Cube panel repository contract
        run: python3 -B -m unittest discover -s tests/spc -p 'test_cube_panel_repository_contract.py'

      - name: SPC snapshot state correlation regression
        run: python3 -B -m unittest discover -s tests/spc -p 'test_correlate_spc_snapshot_state.py'

      - name: Correlate Monster Maker 3 staged snapshot state
        run: |
          python3 -B tools/spc/correlate_spc_snapshot_state.py \
            --input-dir imports/sonic3-attribution/monster-maker-3-spc \
            --expected-count 25 \
            --output spc-mapping-evidence/monster-maker-3-state-correlation.json

      - name: Upload Monster Maker 3 mapping evidence
        uses: actions/upload-artifact@v4
        with:
          name: monster-maker-3-state-correlation
          path: spc-mapping-evidence/monster-maker-3-state-correlation.json
          if-no-files-found: error

      - name: Configure isolated forensic runtime
        run: cmake -S tools/spc/forensic -B build-spc-forensic -DCMAKE_BUILD_TYPE=Release

      - name: Build instrumented accurate SPC runtime
        run: cmake --build build-spc-forensic --parallel 2

      - name: Phase-accurate DSP bridge regression
        run: ctest --test-dir build-spc-forensic --output-on-failure

      - name: Capture and freeze creator-blind four-world panel
        env:
          SECONDS_PER_FIXTURE: ${{ inputs.seconds }}
        run: |
          python3 -B tools/spc/capture_blind_panel.py \
            --panel research/projects/sonic3/spc-cube-blind-panel.json \
            --extractor build-spc-forensic/spc_forensic_features \
            --output-dir spc-forensic-blind/sidecars \
            --freeze-output spc-forensic-blind/frozen-matrix.json \
            --seconds "$SECONDS_PER_FIXTURE"

      - name: Upload frozen creator-blind evidence
        uses: actions/upload-artifact@v4
        with:
          name: spc-forensic-blind
          path: spc-forensic-blind/
          if-no-files-found: error

      - name: Reveal evidence-safe Cube calibration
        run: |
          python3 -B tools/spc/evaluate_cube_calibration.py \
            --freeze spc-forensic-blind/frozen-matrix.json \
            --panel research/projects/sonic3/spc-cube-blind-panel.json \
            --admissions research/projects/sonic3/attribution-control-admissions.jsonl \
            --policy research/projects/sonic3/cube-calibration-policy.json \
            --output spc-forensic-reveal/cube-calibration.json

      - name: Upload post-freeze calibration reveal
        uses: actions/upload-artifact@v4
        with:
          name: spc-forensic-reveal
          path: spc-forensic-reveal/cube-calibration.json
          if-no-files-found: error
