name: Self-reporting VGM 0.31 promotion

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/vgm031-promote-debug.yml"

permissions:
  contents: write

concurrency:
  group: vgm031-bootstrap-promotion
  cancel-in-progress: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Promote or preserve exact failure
        shell: bash
        run: |
          set +e
          {
            echo '== reconstruct and patch =='
            python .bootstrap-transfer/promote_vgm031.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              echo '== py_compile =='
              python -m py_compile tools/materialize_foo_input_vgm.py
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              echo '== private build contract =='
              python -B -m unittest tests.vgm.test_omniphony_private_build_contract
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              echo '== VGM test suite =='
              python -B -m unittest discover -s tests/vgm -p 'test_*.py'
              rc=$?
            fi
            if [ "$rc" -eq 0 ]; then
              echo '== diff check =='
              git diff --check
              rc=$?
            fi
          } 2>&1 | tee /tmp/vgm031-promotion.log
          rc=${PIPESTATUS[0]}

          git config user.name "dissonance"
          git config user.email "ustreamusa@aim.com"

          if [ "$rc" -ne 0 ]; then
            cp /tmp/vgm031-promotion.log .bootstrap-transfer/promotion-failure.log
            git add .bootstrap-transfer/promotion-failure.log
            git commit -m "test: preserve VGM 0.31 promotion failure"
            git push origin HEAD:main
            exit "$rc"
          fi

          git rm -r .bootstrap-transfer
          git rm -f .github/workflows/vgm031-bootstrap-repair.yml
          git rm -f .github/workflows/vgm031-bootstrap-promote.yml
          git rm -f .github/workflows/vgm031-promote-now.yml
          git rm -f .github/workflows/vgm031-promote-debug.yml
          git add imports/foo_input_vgm-0.31.zip \
                  tools/build_private_foobar_components.ps1 \
                  tools/materialize_foo_input_vgm.py \
                  imports/MANIFEST.md
          git diff --cached --check
          git commit -m "build: promote verified foo_input_vgm 0.31 bootstrap"
          git push origin HEAD:main
