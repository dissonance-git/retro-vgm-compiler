name: VGM Compiler identity migration

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/identity-migration.yml"
      - "tools/migrate_project_identity.py"

permissions:
  contents: write

jobs:
  migrate-live-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply bounded live-surface rename
        run: python3 -B tools/migrate_project_identity.py --apply

      - name: Publish migration delta
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No active retired project names remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "docs: finish VGM Compiler identity migration"
          git push origin HEAD:main
