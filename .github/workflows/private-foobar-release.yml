name: Publish verified private foobar runtime

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/private-foobar-release.yml"

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Ensure native build tools
        shell: pwsh
        run: |
          if (-not (Get-Command nasm -ErrorAction SilentlyContinue)) { choco install nasm -y --no-progress }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) { choco install 7zip -y --no-progress }
          $nasmCandidates = @(
            'C:\Program Files\NASM\nasm.exe',
            'C:\Program Files (x86)\NASM\nasm.exe',
            'C:\ProgramData\chocolatey\bin\nasm.exe'
          )
          $nasmExe = $nasmCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nasmExe -and (Test-Path 'C:\ProgramData\chocolatey\lib\nasm')) {
            $nasmExe = Get-ChildItem 'C:\ProgramData\chocolatey\lib\nasm' -Filter nasm.exe -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $nasmExe) { throw 'NASM was installed but nasm.exe could not be located' }
          (Split-Path $nasmExe -Parent) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Reconstruct exact foo_input_vgm 0.31 source
        shell: pwsh
        run: |
          python -B tools/reconstruct_vgm031_bootstrap.py
          if ($LASTEXITCODE -ne 0) { throw 'foo_input_vgm 0.31 reconstruction failed' }

      - name: Run source and bridge guards
        shell: pwsh
        run: |
          python -B -m unittest tests.vgm.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'VGM Surround/Omniphony contract failed' }
          python -B -m unittest tests.spc.test_surround_omniphony_patch_contract
          if ($LASTEXITCODE -ne 0) { throw 'SPC Surround/Omniphony contract failed' }
          python -B -m unittest tests.vgm.test_omniphony_private_build_contract
          if ($LASTEXITCODE -ne 0) { throw 'private Omniphony dependency contract failed' }

      - name: Build and audit installable components
        shell: pwsh
        run: |
          ./tools/build_private_foobar_components.ps1

      - name: Re-verify final package bundle
        shell: pwsh
        run: |
          python -B tools/verify_private_component_packages.py `
            dist/private-components/foo_input_vgm.private.fb2k-component `
            dist/private-components/foo_snesapu.private.fb2k-component
          if ($LASTEXITCODE -ne 0) { throw 'private component package verification failed' }
          python -B tools/verify_private_component_bundle.py dist/private-components
          if ($LASTEXITCODE -ne 0) { throw 'private component bundle verification failed' }

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-foobar-vgm-spc-${{ github.sha }}
          path: |
            dist/private-components/foo_input_vgm.private.fb2k-component
            dist/private-components/foo_snesapu.private.fb2k-component
            dist/private-components/private-foobar-vgm-spc.zip
            dist/private-components/build-manifest.json
            dist/private-components/SHA256SUMS.txt
            dist/private-components/README.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable prerelease assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'private-foobar-delivery'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title 'Private foobar VGM + SPC delivery' `
              --notes 'Audited personal runtime delivery. Generated only after the canonical private component build and package verification pass.' `
              --prerelease
            if ($LASTEXITCODE -ne 0) { throw 'could not create delivery prerelease' }
          }
          gh release upload $tag `
            dist/private-components/private-foobar-vgm-spc.zip `
            dist/private-components/foo_input_vgm.private.fb2k-component `
            dist/private-components/foo_snesapu.private.fb2k-component `
            dist/private-components/build-manifest.json `
            dist/private-components/SHA256SUMS.txt `
            --repo $env:GITHUB_REPOSITORY `
            --clobber
          if ($LASTEXITCODE -ne 0) { throw 'could not upload delivery prerelease assets' }
