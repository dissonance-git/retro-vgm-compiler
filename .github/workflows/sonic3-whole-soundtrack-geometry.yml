name: Sonic 3 whole-soundtrack creator-blind geometry

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write

concurrency:
  group: sonic3-whole-soundtrack-geometry
  cancel-in-progress: false

jobs:
  geometry:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == '[helix-run] sonic3-whole-soundtrack-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify creator-blind analyzer regression surface
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -B -m unittest discover -s tests/vgm -p 'test_*.py'

      - name: Compute all 58-track pairwise geometry
        shell: bash
        run: |
          set -euo pipefail
          python -B tools/sonic3_whole_soundtrack_geometry.py \
            tests/corpus/sonic-3-knuckles \
            --json research/projects/sonic3/execution/sonic3-whole-soundtrack-geometry-2026-08-17.json

      - name: Validate artifact shape
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path('research/projects/sonic3/execution/sonic3-whole-soundtrack-geometry-2026-08-17.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          assert d['corpus_track_count'] == 58
          assert d['unique_pair_count'] == 1653
          assert len(d['structural_matrix']) == 58
          assert len(d['realization_matrix']) == 58
          assert all(len(row) == 58 for row in d['structural_matrix'])
          assert all(len(row) == 58 for row in d['realization_matrix'])
          assert all(v['passed'] for v in d['validation'].values())
          print(p, p.stat().st_size)
          PY
          sha256sum research/projects/sonic3/execution/sonic3-whole-soundtrack-geometry-2026-08-17.json

      - name: Publish bounded research artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/projects/sonic3/execution/sonic3-whole-soundtrack-geometry-2026-08-17.json
          git commit -m 'research: record Sonic 3 whole-soundtrack geometry'
          git pull --rebase origin main
          git push origin HEAD:main
