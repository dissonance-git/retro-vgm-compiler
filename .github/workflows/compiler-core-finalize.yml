name: Compiler core finalize

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compiler-core-finalize.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply guarded core repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_s, old, new, label):
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'{label}: expected one old anchor, found {text.count(old)}')
                  path.write_text(text.replace(old, new, 1), encoding='utf-8')
                  return
              if new not in text:
                  raise SystemExit(f'{label}: neither old nor new anchor found')

          def replace_count(path_s, old, new, count, label):
              path = Path(path_s)
              text = path.read_text(encoding='utf-8')
              if old in text:
                  if text.count(old) != count:
                      raise SystemExit(f'{label}: expected {count} old anchors, found {text.count(old)}')
                  path.write_text(text.replace(old, new), encoding='utf-8')
                  return
              if new not in text:
                  raise SystemExit(f'{label}: neither old nor new anchor found')

          # Release must not compile away assert-based regression verdicts.
          replace_once(
              'CMakeLists.txt',
              'target_compile_options(${test_target} PRIVATE /W4 /permissive-)',
              'target_compile_options(${test_target} PRIVATE /W4 /permissive- /UNDEBUG)',
              'MSVC assertion policy')
          replace_once(
              'CMakeLists.txt',
              'target_compile_options(${test_target} PRIVATE -Wall -Wextra -Wpedantic -Werror)',
              'target_compile_options(${test_target} PRIVATE -Wall -Wextra -Wpedantic -Werror -UNDEBUG)',
              'GCC assertion policy')

          replace_once(
              'tests/vgm/genesis_enhanced_recomposition_test.cpp',
              'spatial_playback_path::source_full_sphere',
              'spatial_playback_path::source_spatial',
              'Genesis spatial path')

          # Refresh the public four-state spatial contract without resurrecting
          # retired externalization/depth knobs.
          spatial = Path('tests/model/spatial_source_test.cpp')
          text = spatial.read_text(encoding='utf-8')
          start_marker = '    // Both foobar components expose enhancement and spatialization as separate\n'
          end_marker = '    auto genesis = gameaudio::vgm::make_genesis_spatial_source('
          start = text.find(start_marker)
          end = text.find(end_marker, start if start >= 0 else 0)
          if start >= 0 and end > start:
              replacement = '\n'.join([
                  '    // Both foobar components expose enhancement and spatialization as separate',
                  '    // user choices. Renderer topology stays internal to Omniphony.',
                  '    vgmtooling::model::spatial_playback_options playback{};',
                  '    assert(!playback.surround);',
                  '    assert(!playback.enhanced);',
                  '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
                  '        == vgmtooling::model::spatial_playback_path::reference_stereo);',
                  '    assert(!vgmtooling::model::uses_source_renderer(playback));',
                  '    assert(!vgmtooling::model::uses_enhanced_renderer(playback));',
                  '',
                  '    playback.enhanced = true;',
                  '    assert(vgmtooling::model::uses_enhanced_renderer(playback));',
                  '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
                  '        == vgmtooling::model::spatial_playback_path::reference_stereo);',
                  '    assert(!vgmtooling::model::uses_source_renderer(playback));',
                  '',
                  '    playback.surround = true;',
                  '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
                  '        == vgmtooling::model::spatial_playback_path::source_spatial);',
                  '    assert(vgmtooling::model::uses_source_renderer(playback));',
                  '    assert(vgmtooling::model::uses_enhanced_renderer(playback));',
                  '',
                  '    playback.enhanced = false;',
                  '    assert(!vgmtooling::model::uses_enhanced_renderer(playback));',
                  '    assert(vgmtooling::model::uses_source_renderer(playback));',
                  '',
                  '    playback.surround = false;',
                  '    assert(vgmtooling::model::resolve_spatial_playback(playback)',
                  '        == vgmtooling::model::spatial_playback_path::reference_stereo);',
                  '    assert(!vgmtooling::model::uses_source_renderer(playback));',
                  '',
                  '',
              ])
              spatial.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          elif 'spatial_playback_path::source_spatial' not in text or 'uses_externalization' in text:
              raise SystemExit('spatial playback contract anchors not found')

          replace_once(
              'components/vgm/enhancement/ym2612_pcm_stream.h',
              '    explicit ym2612_pcm_stream(double output_sample_rate = 48000.0) noexcept;',
              '    ym2612_pcm_stream() noexcept;\n    explicit ym2612_pcm_stream(double output_sample_rate) noexcept;',
              'YM2612 stream constructor declaration')
          replace_once(
              'components/vgm/enhancement/ym2612_pcm_stream.cpp',
              'ym2612_pcm_stream::ym2612_pcm_stream(double output_sample_rate) noexcept {',
              'ym2612_pcm_stream::ym2612_pcm_stream() noexcept\n    : ym2612_pcm_stream(48000.0) {}\n\nym2612_pcm_stream::ym2612_pcm_stream(double output_sample_rate) noexcept {',
              'YM2612 stream constructor definition')
          replace_once(
              'components/vgm/enhancement/genesis_pitch_control_adapter.h',
              '    const node_id device_transition_id = *result.performance.execution.device_transition_id;',
              '    const vgmtooling::model::node_id device_transition_id = *result.performance.execution.device_transition_id;',
              'Genesis pitch transition id')
          replace_once(
              'model/realization_role_grammar_bridge.h',
              'inline structural_grammar_observation realization_role_deployment_as_grammar_observation(',
              'inline blind_structural_grammar_observation realization_role_deployment_as_grammar_observation(',
              'grammar bridge return type')
          replace_once(
              'model/realization_role_grammar_bridge.h',
              '    structural_grammar_observation result;',
              '    blind_structural_grammar_observation result;',
              'grammar bridge local type')

          # Make the flattened storage proof local to the write site.
          replace_once(
              'model/spatial_source_host_assembler.h',
              '        if (!valid_block_shape(block))\n            return fail(spatial_source_host_assembler_error::invalid_block);',
              '        if (!valid_block_shape(block))\n            return fail(spatial_source_host_assembler_error::invalid_block);\n        if (block.lane_count > MaxLanes)\n            return fail(spatial_source_host_assembler_error::invalid_block);',
              'host assembler lane guard')
          replace_once(
              'model/spatial_source_host_assembler.h',
              '            for (std::size_t lane = 0; lane < lane_count_; ++lane) {\n                const auto& source_lane = block.lanes[lane];',
              '            for (std::size_t lane = 0; lane < block.lane_count; ++lane) {\n                const auto& source_lane = block.lanes[lane];',
              'host assembler lane loop')
          replace_once(
              'model/spatial_source_host_assembler.h',
              '                pcm_[lane * CapacityFrames + destination] =\n                    available ? source_lane.mono_pcm[frame] : 0.0f;\n                availability_[lane * CapacityFrames + destination] = available ? 1u : 0u;',
              '                const std::size_t storage_index = lane * CapacityFrames + destination;\n                if (storage_index >= pcm_.size() || storage_index >= availability_.size())\n                    return fail(spatial_source_host_assembler_error::invalid_block);\n                pcm_[storage_index] = available ? source_lane.mono_pcm[frame] : 0.0f;\n                availability_[storage_index] = available ? 1u : 0u;',
              'host assembler storage index')

          replace_once(
              'tests/spc/spc_runtime_snesapu_host_pipeline_test.cpp',
              'spatial_playback_path::source_full_sphere',
              'spatial_playback_path::source_spatial',
              'SPC spatial path')
          replace_count(
              'tests/vgm/sn76489_enhanced_source_block_test.cpp',
              'sn76489_write_kind::data',
              'sn76489_write_kind::register_write',
              5,
              'PSG register writes')

          # Cube calibration policy is schema v4. Gleylancer is now an
          # evidence-ready prospective control and Galaxy Force II is an
          # implementation confound, not a future-acquisition item.
          replace_once(
              'tests/model/test_cube_evidence_worlds.py',
              '        self.assertEqual(self.policy["schema_version"], 2)',
              '        self.assertEqual(self.policy["schema_version"], 4)',
              'cube evidence schema')
          old_future = '''        self.assertTrue(\n            {\n                "Gleylancer",\n                "Galaxy Force II (Mega Drive)",\n                "Human Sports Festival",\n                "Power of the Hired",\n            }.issubset(by_candidate["Masanori Hikichi"])\n        )'''
          new_future = '''        self.assertTrue(\n            {\n                "Human Sports Festival",\n                "Power of the Hired",\n            }.issubset(by_candidate["Masanori Hikichi"])\n        )\n        self.assertNotIn("Gleylancer", by_candidate["Masanori Hikichi"])\n        self.assertNotIn("Galaxy Force II (Mega Drive)", by_candidate["Masanori Hikichi"])\n\n        prospective = self.worlds["prospective_exact_control_worlds"]\n        self.assertTrue(any(\n            item.get("work") == "Gleylancer"\n            and item.get("candidate") == "Masanori Hikichi"\n            for item in prospective\n        ))\n        implementation = self.worlds["arrangement_or_implementation_only"]\n        self.assertTrue(any(\n            item.get("work") == "Galaxy Force II (Mega Drive)"\n            and item.get("candidate") == "Masanori Hikichi"\n            for item in implementation\n        ))'''
          replace_once('tests/model/test_cube_evidence_worlds.py', old_future, new_future, 'cube evidence world migration')
          replace_once(
              'tests/spc/test_cube_panel_repository_contract.py',
              '        self.assertEqual(self.policy["schema_version"], 3)',
              '        self.assertEqual(self.policy["schema_version"], 4)',
              'cube panel schema')

          # Direct Python script execution makes tests/spc sys.path[0], so use
          # unittest discovery from the repository working directory instead.
          for name, pattern in (
              ('spc_original_sample_candidates_python', 'test_original_sample_candidates.py'),
              ('spc_prebrr_sidecar_python', 'test_prebrr_sidecar.py'),
              ('spc_studio_source_sidecar_python', 'test_studio_source_sidecar.py'),
          ):
              old = f'''add_test(\n    NAME {name}\n    COMMAND ${{Python3_EXECUTABLE}} tests/spc/{pattern}\n)'''
              new = f'''add_test(\n    NAME {name}\n    COMMAND ${{Python3_EXECUTABLE}} -B -m unittest discover\n        -s tests/spc\n        -p {pattern}\n)'''
              replace_once('cmake/host_transport_tests.cmake', old, new, f'{name} launcher')

          # The patch source contains both predecessor and successor strings;
          # search for InitAPU only after the actual successor load anchor.
          replace_once(
              'tests/spc/test_studio_source_transport_patch.py',
              '        self.assertLess(text.index("studio_runtime.load("), text.index("InitAPU();"))',
              '        load = text.index("studio_runtime.load(")\n        self.assertLess(load, text.index("InitAPU();", load))',
              'studio transport ordering assertion')

          # Initial device attachment has a proven zero negative-time FM state,
          # so no 31-frame protected-reference startup delay remains.
          replace_once(
              'tests/vgm/studio_source_resampler_test.cpp',
              '''    assert(observed_first.startup_reference_frames\n        == studio_source_resampler_kernel::pre_roll);\n    assert(observed_first.newly_ready_studio_frames == 17);\n    assert(observed_first.pending_future_frames\n        == studio_source_resampler_kernel::post_roll);\n    assert(observer.ready_frames() == 17);\n\n    studio_hq_fm_observer<2, 512, 256>::ready_frame ready{};\n    for (std::uint64_t ordinal = 31; ordinal <= 47; ++ordinal) {''',
              '''    assert(observed_first.startup_reference_frames == 0);\n    assert(observed_first.newly_ready_studio_frames == 48);\n    assert(observed_first.pending_future_frames\n        == studio_source_resampler_kernel::post_roll);\n    assert(observer.first_studio_destination_ordinal() == 0);\n    assert(observer.ready_frames() == 48);\n\n    studio_hq_fm_observer<2, 512, 256>::ready_frame ready{};\n    for (std::uint64_t ordinal = 0; ordinal <= 47; ++ordinal) {''',
              'studio zero-prefix expectations')

          # The old alias metric used a period-16 square whose aliases fold onto
          # the same four FFT bins it called desired. Compare the first four
          # odd-harmonic amplitudes against the ideal band-limited square series.
          psg = Path('tests/vgm/sn76489_alias_test.cpp')
          text = psg.read_text(encoding='utf-8')
          old_helpers = '''double total_ac_energy(const buffer& data) {\n    double mean = 0.0;\n    for (float sample : data)\n        mean += sample;\n    mean /= static_cast<double>(data.size());\n\n    double energy = 0.0;\n    for (float sample : data) {\n        const double centered = static_cast<double>(sample) - mean;\n        energy += centered * centered;\n    }\n    return energy;\n}\n\ndouble sinusoid_energy(const buffer& data, std::size_t bin) {\n    std::complex<double> projection{0.0, 0.0};\n    for (std::size_t n = 0; n < data.size(); ++n) {\n        const double phase = -2.0 * pi * static_cast<double>(bin) *\n            static_cast<double>(n) / static_cast<double>(data.size());\n        projection += static_cast<double>(data[n]) *\n            std::complex<double>(std::cos(phase), std::sin(phase));\n    }\n    return 2.0 * std::norm(projection) / static_cast<double>(data.size());\n}\n\ndouble off_harmonic_energy(const buffer& data) {\n    // 3000 Hz is exactly FFT bin 256 at 48 kHz / 4096. A perfect band-limited\n    // 50% square at this fundamental can contain only the odd harmonics below\n    // Nyquist: 3, 9, 15 and 21 kHz. Everything else is alias/noise energy.\n    const std::array<std::size_t, 4> desired_bins{{256, 768, 1280, 1792}};\n    double desired = 0.0;\n    for (std::size_t bin : desired_bins)\n        desired += sinusoid_energy(data, bin);\n    return std::max(0.0, total_ac_energy(data) - desired);\n}\n'''
          new_helpers = '''double sinusoid_amplitude(const buffer& data, std::size_t bin) {\n    std::complex<double> projection{0.0, 0.0};\n    for (std::size_t n = 0; n < data.size(); ++n) {\n        const double phase = -2.0 * pi * static_cast<double>(bin) *\n            static_cast<double>(n) / static_cast<double>(data.size());\n        projection += static_cast<double>(data[n]) *\n            std::complex<double>(std::cos(phase), std::sin(phase));\n    }\n    return 2.0 * std::abs(projection) / static_cast<double>(data.size());\n}\n\ndouble bandlimited_square_error(const buffer& data) {\n    constexpr std::array<std::size_t, 4> harmonics{{1, 3, 5, 7}};\n    double error = 0.0;\n    for (std::size_t harmonic : harmonics) {\n        const std::size_t bin = 256u * harmonic;\n        const double ideal = 4.0 / (pi * static_cast<double>(harmonic));\n        error += std::abs(sinusoid_amplitude(data, bin) - ideal) / ideal;\n    }\n    return error;\n}\n'''
          if old_helpers in text:
              text = text.replace(old_helpers, new_helpers, 1)
          elif new_helpers not in text:
              raise SystemExit('PSG harmonic helper anchors not found')
          old_asserts = '''    const buffer naive = naive_square();\n    const double enhanced_alias = off_harmonic_energy(enhanced);\n    const double naive_alias = off_harmonic_energy(naive);\n\n    CHECK(naive_alias > 0.0);\n    CHECK(enhanced_alias < naive_alias * 0.75);\n\n    // Improvement must not come from deleting the musical fundamental.\n    const double enhanced_fundamental = sinusoid_energy(enhanced, 256);\n    const double naive_fundamental = sinusoid_energy(naive, 256);\n    CHECK(enhanced_fundamental > naive_fundamental * 0.70);'''
          new_asserts = '''    const buffer naive = naive_square();\n    const double enhanced_error = bandlimited_square_error(enhanced);\n    const double naive_error = bandlimited_square_error(naive);\n\n    CHECK(naive_error > 0.0);\n    CHECK(enhanced_error < naive_error * 0.25);\n\n    // Improvement must not come from deleting the musical fundamental.\n    const double enhanced_fundamental = sinusoid_amplitude(enhanced, 256);\n    const double ideal_fundamental = 4.0 / pi;\n    CHECK(enhanced_fundamental > ideal_fundamental * 0.95);'''
          if old_asserts in text:
              text = text.replace(old_asserts, new_asserts, 1)
          elif new_asserts not in text:
              raise SystemExit('PSG harmonic assertion anchors not found')
          psg.write_text(text, encoding='utf-8')
          PY

      - name: Configure full compiler core
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGAMEAUDIO_BUILD_CORE_TESTS=ON

      - name: Build full compiler core
        run: cmake --build build --parallel 2 -- -k

      - name: Run all compiler core tests
        run: ctest --test-dir build --output-on-failure

      - name: Validate and commit verified repairs
        run: |
          git diff --check
          grep -q -- '-UNDEBUG' CMakeLists.txt
          grep -q 'schema_version"], 4' tests/model/test_cube_evidence_worlds.py
          grep -q 'schema_version"], 4' tests/spc/test_cube_panel_repository_contract.py
          grep -q 'bandlimited_square_error' tests/vgm/sn76489_alias_test.cpp
          grep -q 'startup_reference_frames == 0' tests/vgm/studio_source_resampler_test.cpp
          grep -q 'storage_index >= availability_.size()' model/spatial_source_host_assembler.h
          if git diff --quiet; then
            exit 0
          fi
          git config user.name dissonance
          git config user.email ustreamusa@aim.com
          git add -A
          git commit -m 'test(core): restore assertion-live full suite'
          git push
