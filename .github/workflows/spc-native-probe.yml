name: SPC native build probe

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/spc-native-probe.yml"
      - "patches/snesapu/**"
      - "components/spc/spcplayer/**"
      - "components/spc/*.h"

jobs:
  build-snesapu-native:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout exact Retro source
        uses: actions/checkout@v4

      - name: Install pinned NASM and locate MSVC tools
        shell: pwsh
        run: |
          $package = '2.16.3'
          $binary = '2.16.03'
          choco install nasm --version=$package --allow-downgrade -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NASM $package install failed" }
          if (-not (Get-Command 7z -ErrorAction SilentlyContinue)) {
            choco install 7zip -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw '7-Zip install failed' }
          }
          $candidate = @(
            'C:\Program Files\NASM\nasm.exe',
            'C:\Program Files (x86)\NASM\nasm.exe',
            'C:\ProgramData\chocolatey\bin\nasm.exe'
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $candidate) { throw 'Pinned nasm.exe not found' }
          $dir = Split-Path $candidate -Parent
          $dir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "$dir;$env:Path"
          $version = (& $candidate -v | Out-String).Trim()
          Write-Host $version
          if ($version -notmatch "NASM version $([regex]::Escape($binary))\b") { throw "Unexpected NASM: $version" }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'vswhere.exe not found' }
          $vs = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1)
          if (-not $vs) { throw 'Visual Studio C++ toolchain not found' }
          $vcvars32 = Join-Path $vs 'VC\Auxiliary\Build\vcvars32.bat'
          if (-not (Test-Path -LiteralPath $vcvars32)) { throw "vcvars32.bat not found: $vcvars32" }
          $msbuild = Join-Path $vs 'MSBuild\Current\Bin\MSBuild.exe'
          if (-not (Test-Path -LiteralPath $msbuild)) { throw "MSBuild.exe not found: $msbuild" }
          "VCVARS32=$vcvars32" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MSBUILD=$msbuild" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize exact patched SNESAPU
        shell: pwsh
        run: |
          $spc = Join-Path $env:RUNNER_TEMP 'spcplay'
          git clone --quiet https://github.com/dgrfactory/spcplay.git $spc
          if ($LASTEXITCODE -ne 0) { throw 'spcplay clone failed' }
          git -C $spc checkout --quiet fc770e268ecacb4523699e2edc5c0efdf80957d6
          if ($LASTEXITCODE -ne 0) { throw 'spcplay pin checkout failed' }
          python -B patches/snesapu/apply_private_snesapu.py $spc
          if ($LASTEXITCODE -ne 0) { throw 'private SNESAPU patch stack failed' }
          "SPCPLAY_ROOT=$spc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build complete patched SNESAPU DLL
        shell: pwsh
        run: |
          $source = Join-Path $env:SPCPLAY_ROOT 'snesapu.dll'
          $cmdFile = Join-Path $env:RUNNER_TEMP 'probe-snesapu-x86.cmd'
          @"
          @echo off
          call "$env:VCVARS32"
          if errorlevel 1 exit /b 10
          cd /d "$source"
          if not exist Release mkdir Release
          nasm -f win32 -dWIN32 -dSTDCALL -O2 APU.asm -o Release\APU.obj
          if errorlevel 1 exit /b 11
          nasm -f win32 -dWIN32 -dSTDCALL -O2 DSP.asm -o Release\DSP.obj
          if errorlevel 1 exit /b 12
          nasm -f win32 -dWIN32 -dSTDCALL -O2 SPC700.asm -o Release\SPC700.obj
          if errorlevel 1 exit /b 13
          rc /nologo /fo Release\version.res version.rc
          if errorlevel 1 exit /b 21
          cl /nologo /Gz /MT /W3 /O2 /Ob0 /D NDEBUG /D _USRDLL /c SNESAPU.cpp /FoRelease\SNESAPU.obj
          if errorlevel 1 exit /b 22
          link /nologo /dll /machine:I386 /nodefaultlib /def:SNESAPU.def /out:Release\SNESAPU.dll /implib:Release\snesapu.lib Release\SNESAPU.obj Release\version.res Release\APU.obj Release\DSP.obj Release\SPC700.obj
          if errorlevel 1 exit /b 23
          for %%E in (SetDSPSourceCapture GetDSPSourceData SetDSPPreBrrProvider SetDSPStudioSourceProvider) do (
            dumpbin /exports Release\SNESAPU.dll | findstr /c:"%%E" >nul
            if errorlevel 1 exit /b 24
          )
          exit /b 0
          "@ | Set-Content -LiteralPath $cmdFile -Encoding ASCII
          & cmd.exe /d /c $cmdFile
          if ($LASTEXITCODE -ne 0) { throw "SNESAPU native probe failed with stage exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $source 'Release\SNESAPU.dll') -PathType Leaf)) { throw 'SNESAPU.dll missing after successful native probe' }

      - name: Build source-aware spcplayer child
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'foo-snesapu-current'
          python -B tools/materialize_foo_snesapu.py $workspace --force
          if ($LASTEXITCODE -ne 0) { throw 'foo_snesapu materialization failed' }
          $source = Join-Path $env:SPCPLAY_ROOT 'snesapu.dll'
          $lib = Join-Path $source 'Release'
          $out = Join-Path $env:RUNNER_TEMP 'spcplayer-out'
          $log = Join-Path $env:RUNNER_TEMP 'spcplayer-msbuild.log'
          New-Item -ItemType Directory $out -Force | Out-Null
          & $env:MSBUILD (Join-Path $workspace 'spcplayer\spcplayer.vcxproj') /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 "/p:SNESAPUIncludeDir=$source" "/p:SNESAPULibDir=$lib" "/p:OutDir=$out\" /m /v:m /fl "/flp:logfile=$log;verbosity=diagnostic"
          if ($LASTEXITCODE -ne 0) { throw "spcplayer probe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath (Join-Path $out 'spcplayer.exe') -PathType Leaf)) { throw 'spcplayer.exe missing after successful child build' }
          "FOO_SNESAPU_WORKSPACE=$workspace" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare official foobar SDK for x64 parent
        shell: pwsh
        run: |
          $sdkArchive = Join-Path $env:RUNNER_TEMP 'SDK-2025-03-07.7z'
          $sdkExtract = Join-Path $env:RUNNER_TEMP 'foobar-sdk'
          Invoke-WebRequest -Uri 'https://www.foobar2000.org/downloads/SDK-2025-03-07.7z' -OutFile $sdkArchive -UseBasicParsing
          New-Item -ItemType Directory $sdkExtract -Force | Out-Null
          7z x $sdkArchive "-o$sdkExtract" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'foobar SDK extraction failed' }
          $sdkProject = Get-ChildItem -Recurse -File -Filter 'foobar2000_SDK.vcxproj' -Path $sdkExtract | Select-Object -First 1
          if (-not $sdkProject) { throw 'foobar SDK project not found' }
          $fb2k = Split-Path (Split-Path $sdkProject.FullName -Parent) -Parent
          $sdkRoot = Split-Path $fb2k -Parent

          $wtl = Join-Path $env:RUNNER_TEMP 'WTL'
          git clone --quiet https://github.com/Win32-WTL/WTL.git $wtl
          if ($LASTEXITCODE -ne 0) { throw 'WTL clone failed' }
          git -C $wtl checkout --quiet d1cd80e9ce76c4d79da4cf556401ad7a970ce46f
          if ($LASTEXITCODE -ne 0) { throw 'WTL pin checkout failed' }

          function Junction([string]$Link, [string]$Target) {
            if (Test-Path -LiteralPath $Link) { Remove-Item -LiteralPath $Link -Recurse -Force }
            $parent = Split-Path $Link -Parent
            New-Item -ItemType Directory $parent -Force | Out-Null
            cmd /c "mklink /J `"$Link`" `"$Target`"" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "junction failed: $Link -> $Target" }
          }

          $workspace = $env:FOO_SNESAPU_WORKSPACE
          Junction (Join-Path $workspace 'foobar2000\SDK') (Join-Path $fb2k 'SDK')
          Junction (Join-Path $workspace 'foobar2000\helpers') (Join-Path $fb2k 'helpers')
          Junction (Join-Path $workspace 'foobar2000\shared') (Join-Path $fb2k 'shared')
          Junction (Join-Path $workspace 'foobar2000\foobar2000_component_client') (Join-Path $fb2k 'foobar2000_component_client')
          Junction (Join-Path $workspace 'pfc') (Join-Path $sdkRoot 'pfc')
          Junction (Join-Path $workspace 'libPPUI') (Join-Path $sdkRoot 'libPPUI')
          Junction (Join-Path $workspace 'WTL') $wtl
          "WTL_INCLUDE=$(Join-Path $wtl 'Include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build x64 foo_snesapu parent
        shell: pwsh
        run: |
          $workspace = $env:FOO_SNESAPU_WORKSPACE
          $out = Join-Path $env:RUNNER_TEMP 'foo-snesapu-out'
          $log = Join-Path $env:RUNNER_TEMP 'foo-snesapu-msbuild.log'
          New-Item -ItemType Directory $out -Force | Out-Null
          $env:INCLUDE = "$env:WTL_INCLUDE;$env:INCLUDE"
          $env:CL = if ([string]::IsNullOrWhiteSpace($env:CL)) { "/I`"$env:WTL_INCLUDE`"" } else { "/I`"$env:WTL_INCLUDE`" $env:CL" }
          $env:_CL_ = "$env:_CL_ /permissive /Zc:twoPhase-"
          $rsp = Join-Path $PWD 'Directory.Build.rsp'
          '/p:ConformanceMode=false' | Set-Content -LiteralPath $rsp -Encoding ASCII
          try {
            & $env:MSBUILD (Join-Path $workspace 'foobar2000\foo_snesapu\foo_snesapu.vcxproj') /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 "/p:OutDir=$out\" /m /v:m /fl "/flp:logfile=$log;verbosity=diagnostic"
            if ($LASTEXITCODE -ne 0) { throw "foo_snesapu parent probe failed with exit code $LASTEXITCODE" }
          } finally {
            Remove-Item -LiteralPath $rsp -Force -ErrorAction SilentlyContinue
          }
          if (-not (Test-Path -LiteralPath (Join-Path $out 'foo_snesapu.dll') -PathType Leaf)) { throw 'foo_snesapu.dll missing after successful parent build' }

      - name: Preprocess failed child source
        if: failure()
        shell: pwsh
        run: |
          $workspace = Join-Path $env:RUNNER_TEMP 'foo-snesapu-current'
          $source = Join-Path $env:SPCPLAY_ROOT 'snesapu.dll'
          $preprocessed = Join-Path $env:RUNNER_TEMP 'spcplayer-main.i'
          $cmdFile = Join-Path $env:RUNNER_TEMP 'preprocess-spcplayer.cmd'
          @"
          @echo off
          call "$env:VCVARS32"
          if errorlevel 1 exit /b 10
          cd /d "$workspace\spcplayer"
          cl /nologo /P /C /TP /std:c++17 /permissive- /D_WIN32_WINNT=0x0601 /DWIN32 /DNDEBUG /D_CONSOLE /D_UNICODE /DUNICODE /I"$source" main.cpp /Fi"$preprocessed"
          exit /b 0
          "@ | Set-Content -LiteralPath $cmdFile -Encoding ASCII
          & cmd.exe /d /c $cmdFile

      - name: Upload SPC build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spc-build-diagnostics
          path: |
            ${{ runner.temp }}/spcplayer-msbuild.log
            ${{ runner.temp }}/spcplayer-main.i
            ${{ runner.temp }}/foo-snesapu-msbuild.log
            ${{ runner.temp }}/foo-snesapu-current/spcplayer/main.cpp
            ${{ runner.temp }}/foo-snesapu-current/spcplayer/spcplayer.vcxproj
            ${{ runner.temp }}/foo-snesapu-current/foobar2000/foo_snesapu/input_snesapu.cpp
            ${{ runner.temp }}/foo-snesapu-current/foobar2000/foo_snesapu/input_snesapu.hpp
            ${{ runner.temp }}/foo-snesapu-current/foobar2000/foo_snesapu/foo_snesapu.vcxproj
          if-no-files-found: warn
